name: Mirror routing tiles

# Weekly, until we host all six.
#
# Every rider who plans a route offline in Britain currently pulls a 139 MB
# tile from brouter.de — a volunteer-run service we have no agreement with and
# no fallback for. If it fails, it fails by being
# blocked, and then offline routing stops working for every rider at once, on a
# moor, with the app reporting a download failure it cannot explain.
#
# Serving the tiles from this repository's own releases removes the
# dependency.
#
# SIX TILES, NOT FIVE HUNDRED (plan step 1.6).
#
# This job used to work through every tile the catalogue offered — 526 distinct
# files, 7.9 GB — on the argument that the 5x5 grid covers the world for free.
# Free to LIST is not free to host or to keep fresh, and the app publishes
# lanes in England and Wales and nowhere else. Great Britain needs SIX tiles,
# 293 MB: W10_N50, W5_N50, E0_N50, W10_N55, W5_N55, E0_N55.
#
# IT DELETES NOTHING. The box grazes six tiles carrying no British ground —
# the N45 row (France and northern Spain, two tenths of a degree below the
# box's southern edge) and the N60 row (Shetland, where we publish no lanes) —
# 193,163,753 bytes of the 486,484,824 the catalogue offered for "the United
# Kingdom". Three of them are already mirrored, 191,627,782 bytes, and they
# fall out of scope. They are LISTED in the log and in the job summary and left
# exactly where they are: stopping the fetch and deleting a published release
# asset are two changes, and a rider mid-download holds a URL that would stop
# answering. The prune step below only removes tiles UPSTREAM has withdrawn,
# which these are not.
#
# Until a tile is mirrored the catalogue keeps pointing upstream, so the
# switchover is gradual and nothing breaks halfway.
on:
  schedule:
    - cron: '23 4 * * 2'   # 04:23 UTC on Tuesdays
  workflow_dispatch:
    inputs:
      budget:
        description: 'Tiles to mirror this run'
        type: string
        default: '6'

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror-routing
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Take our own copy
        id: mirror
        # Inputs reach the shell through env, quoted: never pasted into
        # the script, where a quote in one would run as code.
        env:
          BUDGET: ${{ inputs.budget || '6' }}
        run: |
          mkdir -p dist/routing
          python tools/mirror_routing.py \
            --catalogue catalogue.json \
            --out dist/routing \
            --index routing/index.json \
            --budget "$BUDGET" | tee /tmp/mirror.log

          # Nothing new is an ordinary outcome, not a failure.
          if grep -q '^nothing due' /tmp/mirror.log; then
            echo "did=false" >> "$GITHUB_OUTPUT"
          else
            echo "did=true" >> "$GITHUB_OUTPUT"
          fi

      # WHERE A HUMAN WILL ACTUALLY SEE IT.
      #
      # The tool prints what has fallen out of scope and refuses to act on it,
      # which is right — but a list buried 200 lines into a weekly job's log
      # is a list nobody reads, and then the tiles sit published for ever with
      # nothing saying why. Onto the run summary, every week, until somebody
      # runs tools/prune_published.py against them deliberately.
      - name: What has fallen out of scope
        if: always()
        run: |
          if grep -q '^WOULD PRUNE' /tmp/mirror.log; then
            {
              echo "### Mirrored routing tiles no longer in scope"
              echo
              echo 'These are still published. Nothing here deletes them.'
              echo 'Deleting them is a separate, deliberate step:'
              echo '`tools/prune_published.py`, run by a person.'
              echo
              echo '```'
              sed -n '/^WOULD PRUNE/,/^$/p' /tmp/mirror.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Before anything is published: what we mirrored must be something the
      # routing engine can actually open. A tile that transfers cleanly and
      # will not parse is 139 MB a rider downloads and cannot use.
      #
      # The header is 25 big-endian longs: top 16 bits a lookup version, low
      # 48 a file offset. The LAST offset is where the data ends, so it has to
      # land inside the file — a login page or an error document fails that at
      # once. And the version has to match the lookups.dat the app ships, or
      # every rider gets "lookup version mismatch" the first time they ask for
      # a route, having already paid for the download.
      - name: Can the routing engine open it?
        if: steps.mirror.outputs.did == 'true'
        env:
          EXPECTED_LOOKUP_VERSION: '11'
        run: |
          python - <<'PY'
          import glob, os, struct, sys

          expected = int(os.environ["EXPECTED_LOOKUP_VERSION"])
          tiles = sorted(glob.glob("dist/routing/*.rd5"))
          if not tiles:
              sys.exit("nothing to check")

          for path in tiles:
              size = os.path.getsize(path)
              name = os.path.basename(path)
              if size < 200:
                  sys.exit("%s is %d bytes; that is not a tile" % (name, size))
              with open(path, "rb") as f:
                  head = f.read(200)

              index = []
              for i in range(25):
                  (lv,) = struct.unpack_from(">q", head, i * 8)
                  index.append((lv >> 48, lv & 0xFFFFFFFFFFFF))

              version = index[0][0]
              if version != expected:
                  sys.exit(
                      "%s is lookup version %d, the app ships %d. Every rider "
                      "would download it and be told 'lookup version mismatch' "
                      "the first time they asked for a route."
                      % (name, version, expected))

              end = index[24][1]
              if not (0 < end <= size):
                  sys.exit("%s: data ends at %d in a %d byte file"
                           % (name, end, size))
              if any(index[i][1] > index[i + 1][1] for i in range(24)):
                  sys.exit("%s: header offsets are not in order" % name)

              print("%s OK (%.0f MB, lookup v%d)" % (name, size / 1e6, version))
          PY

      # THE ORDER IS THE POINT.
      #
      # The tiles go up under STABLE names (E0_N50.rd5 ...) with --clobber, so
      # the moment one is uploaded every rider downloading it gets the new
      # bytes - and the sha256 they check it against is whatever
      # routing/index.json and catalogue.json on main say. Between the upload
      # and the push those two disagree, and if the push is lost they go on
      # disagreeing for a week: every routing-tile download fails its checksum
      # on every phone.
      #
      # So everything that can refuse is done BEFORE the first upload: the
      # catalogue is built, reported, verified and committed locally. After the
      # upload the only thing left to go wrong is the push, and the push is
      # retried by re-running the recipe on top of whatever landed meanwhile,
      # as height.yml does. The conditions job pushes after the 03:23 lane
      # refresh, and this run is up to three hours long from 04:23: losing
      # that race is ordinary, not rare.
      - name: Publish
        if: steps.mirror.outputs.did == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          WORK="${RUNNER_TEMP:-/tmp}"
          # What THIS run recorded for the tiles it fetched. A reset onto
          # origin/main throws the working tree's index away; this is what is
          # put back on top of main's, entry by entry.
          cp routing/index.json "$WORK/routing-index.ours.json"
          export REPO_URL
          bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json

          # THE TWO READINGS STEPS 1.6 AND 1.7 ARE GATED ON, taken from the
          # catalogue this job is about to publish rather than from a figure
          # somebody typed. Routing files and bytes; any pack still carrying a
          # `vehicle` key; and what a rider downloading the whole UK gets.
          #
          # `--check-no-vehicle` is ENFORCED: build_catalogue.py no longer
          # emits the key, so a catalogue that has one means something else
          # put it back and the partition is growing again.
          #
          # `--check-default-uk` is NOT enforced yet, and that is recorded
          # rather than quiet. It reads 2,196 MB today because the lane
          # containers are still vehicle-partitioned — four datasets over the
          # same ground, 915 MB of which 627 MB is footpaths the ways schema
          # does not carry at all. Step 1.2 collapses them; against a
          # reconstructed post-1.2 container set this same command reads
          # 1,224 MB, under the 1,500 MB budget by 276 MB. TURN THE FLAG ON IN
          # THE LINE BELOW THE DAY 1.2 LANDS — not later, or the budget goes
          # back to being a sentence in a document.
          #
          # NOT PIPED INTO tee. The default shell here is `bash -e`, without
          # pipefail, so a refusal on the left of a pipe is swallowed and the
          # step goes green - which is precisely the shape of gate this plan's
          # own rules forbid. Captured, shown, appended, and then the exit
          # status is asserted on a line of its own.
          REPORT_FAILED=
          python tools/build_catalogue.py --report dist/catalogue.json \
            --check-no-vehicle > /tmp/catalogue-report.txt || REPORT_FAILED=1
          cat /tmp/catalogue-report.txt
          {
            echo '### Catalogue'
            echo '```'
            cat /tmp/catalogue-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$REPORT_FAILED" ]
          # Refuses to publish a catalogue that lost something already
          # published. The catalogue is rebuilt from scratch, so a job that
          # forgets an index DELETES what another job published - silently, in
          # a build that otherwise succeeds. It has happened three times.
          python tools/verify_catalogue.py dist/catalogue.json
          mv dist/catalogue.json catalogue.json

          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A routing/index.json catalogue.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          commit_it() {
            MIRRORED=$(python -c "import json;print(len(json.load(open('routing/index.json'))['tiles']))")
            git commit -m "Mirror routing: ${MIRRORED} tiles now served by us" \
                       -m "Riders no longer pull these from brouter.de."
          }
          commit_it

          # Only now, with the commit that names them ready to go, are the
          # served bytes replaced. The marker tells the failure alarm below
          # that riders ARE affected if this step stops from here on.
          gh release view routing >/dev/null 2>&1 || \
            gh release create routing \
              --title "Routing tiles" \
              --notes "BRouter segment tiles, mirrored so riders download from us rather than from brouter.de. Data © OpenStreetMap contributors (ODbL); tiles built by the BRouter project." \
              --latest=false
          touch "$WORK/routing-uploaded"
          for tile in dist/routing/*.rd5; do
            gh release upload routing "$tile" --clobber
          done

          # Re-recording, after a reset: main's routing/index.json, with the
          # entry for every tile THIS run uploaded taken from ours - and its
          # bytes and sha256 measured again from the file in dist/, which is
          # the file that was uploaded. Merged, not copied whole, so a tile
          # the satellite job's prune withdrew meanwhile stays withdrawn.
          cat > "$WORK/rerecord-routing.py" <<'PY'
          import glob, hashlib, json, os, sys
          ours = json.load(open(sys.argv[1], encoding="utf-8"))["tiles"]
          index = {"tiles": {}}
          if os.path.exists("routing/index.json"):
              index = json.load(open("routing/index.json", encoding="utf-8"))
          held = index.setdefault("tiles", {})
          tiles = sorted(glob.glob("dist/routing/*.rd5"))
          if not tiles:
              sys.exit("no tiles in dist/routing to re-record")
          for path in tiles:
              name = os.path.basename(path)[:-len(".rd5")]
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
              entry = dict(ours[name])
              entry["bytes"] = os.path.getsize(path)
              entry["sha256"] = digest.hexdigest()
              if entry["sha256"] != ours[name]["sha256"]:
                  sys.exit("%s in dist is not the tile this run recorded" % name)
              held[name] = entry
              print("re-recorded %s %s" % (name, entry["sha256"][:16]))
          with open("routing/index.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(index, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          # NO REBASE. A generated file does not merge, it has a recipe:
          # catalogue.json is rebuilt whole by both sides, so rebasing it
          # conflicts every time by construction. Reset onto main and run the
          # recipe again on top of it instead, up to three times.
          for attempt in 1 2 3; do
            if git push; then
              rm -f "$WORK/routing-uploaded"
              exit 0
            fi
            echo "push rejected; re-recording on top of origin/main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python "$WORK/rerecord-routing.py" "$WORK/routing-index.ours.json"
            bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
            python tools/build_catalogue.py --report dist/catalogue.json \
              --check-no-vehicle > /tmp/catalogue-report.txt
            python tools/verify_catalogue.py dist/catalogue.json
            mv dist/catalogue.json catalogue.json
            git add -A routing/index.json catalogue.json
            if git diff --cached --quiet; then
              # Main already names exactly these bytes.
              rm -f "$WORK/routing-uploaded"
              exit 0
            fi
            commit_it
          done
          echo "could not publish the routing index after three attempts;" \
               "the tiles on the release are new and the index is not" >&2
          exit 1

      # Anything we publish and no longer should. Nothing else removes
      # anything: an entry is replaced when it is rebuilt, but a withdrawn
      # area or a tile upstream stops publishing would be offered for ever,
      # frozen at whenever it was last built, with nothing saying so.
      #
      # It refuses to act on an empty catalogue, because a build that failed
      # looks exactly like one where everything was withdrawn and the second
      # reading deletes the lot.
      - name: Prune what is no longer published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/prune_published.py             --catalogue catalogue.json             --satellite satellite/index.json             --routing routing/index.json             --apply > /tmp/orphans.txt || exit 0

          while read -r release asset; do
            [ -n "$asset" ] || continue
            echo "deleting $asset from the $release release"
            gh release delete-asset "$release" "$asset" --yes || true
          done < /tmp/orphans.txt

          if [ -s /tmp/orphans.txt ]; then
            git add -A satellite/index.json routing/index.json
            git diff --cached --quiet || {
              git commit -m "Prune withdrawn packs"
              # No rebase here. Pruning is idempotent and runs every time,
              # so a rejected push costs nothing but a day - whereas rebasing
              # a generated catalogue conflicts by construction and leaves the
              # tree mid-rebase, which is how a recoverable race became a
              # broken one. Give up cleanly and let tomorrow's run do it.
              git push || echo "push rejected; the next run prunes again"
            }
          fi

      - name: Raise an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Two different failures, and only one of them is harmless. The
          # Publish step leaves this marker from its first upload until its
          # index is on main.
          if [ -e "${RUNNER_TEMP:-/tmp}/routing-uploaded" ]; then
            TITLE="Routing mirror half-published on $(date -u +%Y-%m-%d): tile checksums are wrong"
            BODY=$(cat <<EOF
          **Riders are affected now.** This run replaced routing tiles on the
          \`routing\` release (stable names, --clobber) but could not push the
          routing/index.json and catalogue.json that name their new sha256.
          Until it does, every rider who downloads one of those tiles gets
          bytes the catalogue's checksum refuses, and offline routing for that
          area will not download.

          Log: $RUN_URL

          Fix: run this workflow again by hand (Actions > Mirror routing tiles
          > Run workflow). main still records the old tiles, so the same tiles
          are due again; it fetches, uploads and publishes the index. Left
          alone, the next scheduled run on Tuesday does the same.
          EOF
          )
          else
            TITLE="Routing mirror failed on $(date -u +%Y-%m-%d)"
            BODY=$(cat <<EOF
          Mirroring routing tiles failed before any tile was uploaded, so
          **nothing was published**. The release and the catalogue still
          agree with each other, as they did before this run.

          Log: $RUN_URL

          Most likely: brouter.de was slow, or its directory listing changed
          format. The tool stops rather than publishing a tile it could not
          verify.
          EOF
          )
          fi
          EXISTING=$(gh issue list --label mirror --state open \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            # The whole body, not "failed again": a half-publish under an
            # issue opened for a harmless failure must not read as harmless.
            gh issue comment "$EXISTING" --body "$TITLE

          $BODY"
          else
            gh label create mirror --color 0E8A16 \
              --description "Mirroring third-party data" 2>/dev/null || true
            gh issue create --title "$TITLE" \
              --body "$BODY" --label mirror
          fi

      # AND STAND IT DOWN AGAIN.
      #
      # Nothing closed these. Two of the three issues open on 16 September were
      # for faults that had already fixed themselves - satellite had succeeded
      # several times since its issue was raised - and an alarm that never
      # resets is one people learn to scroll past, which is the failure the
      # alarm exists to prevent.
      - name: Stand the alarm down if this worked
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label mirror --state open \
                       --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "Fixed: $RUN_URL succeeded." || true
          done
