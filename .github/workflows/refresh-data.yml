name: Refresh lane data

# Free: GitHub Actions has no minute limit on public repositories, and this
# repository is public because the app has to download from it without
# credentials.
#
# Monthly, because that is roughly how often councils amend a definitive map,
# and because the fetch is 25 minutes of somebody else's bandwidth.
#
# It used to also be because a run republished 100 MB of near-identical packs
# and made every rider re-download them for nothing. That is no longer true:
# the build is reproducible, so a run over unchanged council data produces
# byte-identical packs and publishes nothing at all. Running this more often
# now costs rowmaps.com a fetch and costs riders nothing - which is the right
# way round, and the reason the frequency could be revisited.
on:
  schedule:
    # FOUR TIMES A DAY, not monthly. PIVOT-SPEC.md 5.6: "lane data" is the
    # whole legal picture - the ways AND the orders against them - and a rider
    # is never more than six hours behind a change of any kind.
    #
    # Cron is UTC and the window is local, so this lands at 04:23, 10:23, 16:23
    # and 22:23 British Summer Time, an hour earlier in winter. Minutes off the
    # hour so it does not queue behind everybody else's cron, and :23 past an
    # ODD hour keeps it an hour clear of traffic-orders.yml at '23 2,8,14,20'.
    #
    # WHAT MAKES THIS AFFORDABLE IS THE PUBLISH STEP, NOT THIS LINE. Councils
    # do not republish a definitive map four times a day, so 120 of these 121
    # runs a month must cost riders nothing. The step at the bottom is what
    # guarantees that: the build is reproducible, so it diffs the rebuilt packs
    # and containers against the published ones and exits before moving
    # anything when they are identical. Check often, publish on change.
    #
    # MEASURED, AND IT DOES NOT HOLD YET. Two golden builds of the same region
    # six hours apart, with the council data untouched:
    #
    #     every .tbmap byte-identical - 4 of 4
    #     containers/manifest.json    - DIFFERS, one field:
    #         "generated": "2026-03-01T00:00:00Z"
    #      -> "generated": "2026-03-01T01:04:59Z"
    #
    # That file sits INSIDE the containers/ tree the Publish step diffs, so the
    # step says "publish" on a run where nothing moved. The top-level
    # manifest.json and catalogue.json are already held back for exactly this
    # reason - the run stamp - and containers/manifest.json was missed. At a
    # monthly cadence it cost 12 needless republishes a year and nobody saw it.
    # On this line it costs 121 a month: 121 commits, 121 catalogue rebuilds,
    # and the "update available" badge on every rider's phone four times a day
    # for data that has not changed. WAYS-SCHEMA.md says it in as many words -
    # "built_at must not leak into any pack's content hash".
    #
    # THE FIX IS ONE LINE IN THE PUBLISH STEP, and it is not in this agent's
    # file set to make. Either exclude the field there -
    #     diff -rq -x manifest.json containers dist/containers
    # holding containers/manifest.json back with the other two - or stop
    # build_containers.py stamping a run clock into it at all, which is better
    # because it makes the tree a function of the data and nothing else.
    #
    # UNTIL THAT LANDS, this line is a bandwidth bill rather than a feature.
    # If the diff is weakened again later, it goes back to monthly on the same
    # commit.
    - cron: '23 3,9,15,21 * * *'   # 04:23, 10:23, 16:23, 22:23 BST
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Reuse the cached council data instead of re-fetching'
        type: boolean
        default: false
      force:
        description: 'Publish even if the safety checks object (read them first)'
        type: boolean
        default: false
      refresh_pois:
        description: 'Re-fetch POIs for every region, whatever the cache says'
        type: boolean
        default: false
      refresh_conditions:
        description: 'Re-fetch EA stations and OSM fords, whatever the cache says'
        type: boolean
        default: false
      dry_run:
        description: 'Build and run every gate, then publish NOTHING'
        type: boolean
        default: false

permissions:
  contents: write   # to commit the rebuilt packages
  issues: write     # to raise one when a run fails

concurrency:
  group: refresh-data
  cancel-in-progress: false   # never interrupt a run mid-publish

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The fetch alone is ~25 minutes across 149 authorities, paced so we are
    # not hammering rowmaps.com. The default 6h ceiling is ample; this guards
    # against a hung request holding a runner all day.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pillow because the tool-suite glob runs tools/test_build_height.py,
        # which loads build_height.py, which reads PNG height tiles. It was
        # never installed and the step died on it - after the fetch, twenty-five
        # minutes in.
        run: pip install --quiet cryptography Pillow

      # BEFORE THE FETCH, NOT AFTER IT.
      #
      # This check used to sit below "Fetch rights of way", which walks ninety
      # council servers. The run on 14 September spent 15m41s doing exactly
      # that and was then stopped by a missing secret — a test that costs
      # nothing and could not have passed at any point during those fifteen
      # minutes. It also puts avoidable load on other people's servers to
      # produce a result that is thrown away.
      #
      # Anything the run cannot proceed without belongs here, at the top,
      # whatever order the steps that USE it come in.
      - name: Write the packaging key
        env:
          # Repository secret. Public repositories do not expose secrets to
          # forked pull requests, and nothing here runs on pull_request.
          DATASET_KEY_B64: ${{ secrets.DATASET_KEY_B64 }}
        run: |
          if [ -z "$DATASET_KEY_B64" ]; then
            echo "::error::DATASET_KEY_B64 is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "It must be the same key the shipped app was built with, or"
            echo "every rider's packages will stop opening."
            exit 1
          fi
          printf '%s' "$DATASET_KEY_B64" > /tmp/dataset.key
          # 32 bytes, base64 encoded, is 44 characters with padding.
          test "$(wc -c < /tmp/dataset.key)" -ge 43

      # The fetch is resumable and skips authorities it already has, so a
      # cached copy turns a 25-minute step into seconds and only picks up
      # what changed.
      # RESTORE AND SAVE SEPARATELY, so a later failure does not throw the
      # fetch away.
      #
      # `actions/cache` saves in a post step that is SKIPPED when the job fails.
      # This job has failed on its last three attempts - the trips guard, then
      # the container guard - so the cache had never once been written, every
      # run re-scraped 149 councils for twenty-five minutes, and `skip_fetch`
      # could never work because there was nothing to skip to. Checked rather
      # than assumed: `gh cache list` showed no rowmaps- entry at all.
      #
      # Splitting it and saving with `if: always()` means a failed build still
      # leaves the next one a warm cache - which is also the polite thing to do
      # to rowmaps.com, who are hosting this data for nothing.
      - name: Restore the council data cache
        id: council_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}
          restore-keys: rowmaps-

      - name: Fetch rights of way
        if: ${{ !inputs.skip_fetch }}
        run: python tools/fetch_rights_of_way.py

      # Immediately after the fetch, and unconditionally. Everything that can
      # fail from here on has nothing to do with whether the council data is
      # worth keeping.
      - name: Keep the council data for the next run
        if: always() && hashFiles('cache/authorities.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}

      # The build now REFUSES to publish if any lane falls outside every
      # region box. Such a lane is in the source data, in no package and on
      # nobody's phone, and nothing used to say so.
      # EVERY tools/test_*.py runs, by glob, so a new one is wired in by
      # existing. Three suites written in phase 1 - the gradient reader, the
      # OSM attribute matcher and the POI extractor - were each complete and
      # each unreachable from CI, because the wiring is a named line per test
      # and nobody owned the file that names them.
      - name: Run every tool suite
        run: |
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t" || exit 1
          done

      # The golden build: one region end to end, byte-compared against a
      # stored expectation. It refuses a change nobody has blessed.
      - name: Golden build
        run: |
          python tools/golden.py

      - name: Build the packages
        run: |
          python tools/build_packages.py --key /tmp/dataset.key

      # THE CONTAINERS ARE WHAT A RIDER DOWNLOADS. The packs above are where
      # the fetched rows are assembled and checked; this turns each one into
      # the `.tbmap` the app reads - vector tiles for the map, an indexed
      # record table for every legal answer - and one overview per vehicle.
      #
      # Measured on the real catalogue: 99 containers, and the whole of England
      # and Wales for a motorcyclist is 5.7 MB.
      # FROM dist/, NOT FROM THE CHECKOUT. build_packages.py writes the fresh
      # manifest and packs into dist/, and they only move into place after the
      # "did anything change" diff much further down. Reading the committed
      # manifest here would have built THIS month's containers out of LAST
      # month's packs, published them under this month's hashes, and nothing
      # would have looked wrong.
      # POIs ON A SLOW CLOCK, AND THAT IS THE POINT.
      #
      # POIs travel inside the area container (WAYS-SCHEMA.md), so re-fetching
      # them rewrites container bytes - and container bytes are what a rider
      # re-downloads. On the 4x-daily ways clock that would be up to 121
      # republishes a month over a fuel station that has not moved: the same
      # fault the manifest run stamp had, arriving through a different door.
      #
      # So the CACHE decides, not the schedule. The fetch runs for a region
      # with no cache, or one whose oldest `fetched_at` is over 30 days old,
      # or when somebody asks. Between refreshes the ways build reads the same
      # cache and produces the same POI bytes, four times a day, unchanged.
      #
      # The cache lives under `cache/`, which the restore and save steps above
      # already carry, so this adds no CI state of its own.
      - name: Does any region need its POIs refreshed?
        id: poi_age
        run: |
          python tools/poi_staleness.py >> "$GITHUB_OUTPUT"

      - name: Fetch POIs for the regions that need them
        if: ${{ steps.poi_age.outputs.regions != '' || inputs.refresh_pois }}
        run: |
          set -u
          REGIONS="${{ steps.poi_age.outputs.regions }}"
          if [ "${{ inputs.refresh_pois }}" = "true" ]; then
            REGIONS="south-west,south-east,east-anglia,midlands,wales,north"
          fi
          for region in $(echo "$REGIONS" | tr ',' ' '); do
            echo "::group::POIs for $region"
            # OVERPASS IS SOMEBODY ELSE'S SERVER and this is a courtesy call,
            # so a region that will not come back does NOT fail the lane
            # build. The container then keeps the POIs it already had, or gets
            # none and no POI tables - and the manifest's poiCount says which,
            # null for "nobody has fetched this" against a number for "we
            # looked".
            python tools/build_pois.py fetch --region "$region" --refresh \
              || echo "  $region did not come back; keeping what we have"
            echo "::endgroup::"
          done

      # KEEP WHAT OVERPASS GAVE US, the same way and for the same reason as the
      # council data above. That save runs before this step, so it never held
      # a POI: every run found every region stale and re-fetched all six from
      # somebody else's server - 90 minutes on 24 Sep, and the "slow clock"
      # this section is built around never once ticked. A newer key under the
      # same `rowmaps-` prefix is what the restore picks up next time.
      - name: Keep the POIs for the next run
        if: always() && hashFiles('cache/authorities.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}-pois

      - name: Build the map containers
        env:
          # Signing closes the hole the sealing never did: the pack key ships
          # in the app, so a substituted catalogue can point at a substituted
          # pack sealed under it. Missing, the build warns and publishes
          # unsigned rather than failing - but see the guard below, which will
          # not let an unsigned build through.
          TB_SIGNING_KEY_PEM: ${{ secrets.TB_SIGNING_KEY_PEM }}
        run: |
          python tools/test_mvt.py
          python tools/test_build_changeset.py
          python tools/test_build_containers.py
          python tools/test_build_map_container.py
          python tools/test_sign_release.py
          python tools/test_stable_ids.py
          # --previous containers: the PUBLISHED tree, which is what riders
          # hold. Every POI keeps the rowid it has there and a new one goes
          # on the end (tools/stable_ids.py). Numbered 1..N in uid order,
          # one new POI renumbered the region and its changeset was 5.87 MB
          # of a 9.47 MB container; kept, it is 15.9 kB.
          python tools/build_containers.py \
            --manifest dist/manifest.json \
            --root dist \
            --key /tmp/dataset.key \
            --poi-cache cache/pois \
            --previous containers \
            --out dist/containers

      # ===================================================================
      # THE CONDITIONS PIPELINE, STATIC HALF.
      #
      # tools/ea_flood.py, tools/build_wet.py, tools/build_fords.py and
      # tools/evidence_age.py were written, tested and proved end to end
      # against live Environment Agency data, and then no job ran any of them,
      # so not one byte reached a rider. That is build_pois.py, the 4x4 filter,
      # the HelpScreen and seven others: a finished feature nothing calls.
      #
      # THE SPLIT IS THE DESIGN, AND IT IS ABOUT BANDWIDTH.
      #
      # What goes in the container is what does not move: which lane is soft,
      # where the fords are, which gauge speaks for each, and how far away it
      # is. A container is ~190 MB and a rider re-downloads one whenever its
      # bytes change. Writing this morning's rainfall into one would republish
      # a fifth of a gigabyte to say that it had drizzled in Shropshire - the
      # same fault the POI cache and the containers/manifest.json run stamp
      # both exist to prevent, arriving through a third door. The rain itself
      # is the LIVE half, in the `conditions` job below, and it is kilobytes.
      #
      # SO THIS HALF MUST NOT MOVE EITHER, and two of its inputs would have.
      #
      #   * THE GAUGE NETWORK is re-fetched only when the cache is missing or
      #     over 30 days old - `poi_staleness.MAX_AGE_DAYS`, and the same
      #     bargain that step makes for POIs. Re-fetched four times a day, a
      #     single EA station opening or closing would rewrite the country.
      #   * HOW OLD THE EVIDENCE IS goes in as DATES (`meta.evidence_dates`),
      #     never as ages. It used to be `meta.evidence_age`, days counted
      #     back from an `--as-of` pinned to the 1st of the month - and even
      #     pinned, that moved every region container's bytes on the first
      #     run of every month with nothing in it changed, under an unchanged
      #     `built_at`, so the app fetched all six regions whole (~94 MB) and
      #     no changeset could cover it. A date does not age; the app counts
      #     the days on the phone.
      #
      # The fords cache is already self-skipping (`fetch` returns early when
      # the region's file is there), so it is on the same slow clock for free.
      - name: Cache the Environment Agency gauge network
        run: |
          set -euo pipefail
          mkdir -p cache/ea
          need=no
          for parameter in rainfall level; do
            f="cache/ea/stations-$parameter.json"
            if [ ! -s "$f" ] || [ -n "$(find "$f" -mtime +30)" ]; then
              need=yes
            fi
          done
          if [ "$need" = "no" ] && [ "${{ inputs.refresh_conditions }}" != "true" ]; then
            echo "gauge network cached and under 30 days old; not re-fetching."
            echo "Container bytes stay put, which is the whole point of this half."
          else
            python tools/ea_flood.py stations --parameter rainfall --out cache/ea
            python tools/ea_flood.py stations --parameter level    --out cache/ea
          fi
          # SEEN TO HAVE PRODUCED OUTPUT. A cached file that is there and empty
          # would take every later step down the "no gauge within 50 km" path
          # and publish a country with no conditions at all, greenly.
          python - <<'PY'
          import json, sys
          for parameter in ("rainfall", "level"):
              path = "cache/ea/stations-%s.json" % parameter
              stations = json.load(open(path, encoding="utf-8"))["stations"]
              placed = [s for s in stations if s.get("lat") is not None]
              print("%-8s %5d stations, %d placed" % (parameter, len(stations),
                                                      len(placed)))
              if len(placed) < 100:
                  sys.exit("%s carries %d placed stations. The EA publishes "
                           "~1,000 rainfall and ~3,500 level sites; this is a "
                           "half-fetch, and a half-fetch silently un-gauges "
                           "whole regions." % (path, len(placed)))
          PY

      # Which file each region's conditions go into, read from the manifest the
      # container build has just written rather than assumed from a name.
      # Step 1.2 renamed every container once already (motor-* -> ways-*) and a
      # hard-coded path would have gone on pointing at a file that is not there
      # - which is exactly how `container_path` in golden.py rotted.
      - name: Which container covers each region?
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/region-containers.txt
          import json, os, sys
          sys.path.insert(0, "tools")
          import build_pois as PO

          manifest = json.load(open("dist/containers/manifest.json",
                                    encoding="utf-8"))
          areas = [c for c in manifest["containers"] if c.get("kind") == "area"]
          missing = []
          for region in sorted(PO.REGIONS):
              hits = [os.path.join("dist", c["file"]) for c in areas
                      if c.get("area") == region]
              if not hits:
                  missing.append(region)
              for path in hits:
                  print("%s %s" % (region, path))
          if missing:
              # A REGION SKIPPED IS THE FAILURE, NOT A WARNING. The feeds below
              # are published per region whatever happens, so a region with no
              # container would get a live river feed and no fords to join it
              # to - a rider in Wales told nothing, with every job green.
              sys.exit("no area container for: %s. The regions are "
                       "build_pois.REGIONS, which is also what the live feeds "
                       "are published for, so the two cannot disagree."
                       % ", ".join(missing))
          PY
          test -s /tmp/region-containers.txt

      # Surface crossed with the gauge that speaks for it. Nothing here is a
      # verdict: an unknown surface is advised on as if soft and `basis` says
      # why, because "surface not recorded" and "this lane is mud" are
      # different sentences and the app owes a rider the difference.
      - name: Which lanes are soft, and which gauge speaks for each
        run: |
          set -euo pipefail
          mkdir -p /tmp/conditions
          while read -r region container; do
            echo "::group::wetness for $region ($container)"
            # Gauges keep the ids riders hold (tools/stable_ids.py).
            python tools/build_wet.py assign \
              --container "$container" \
              --stations cache/ea/stations-rainfall.json \
              --previous "containers/$(basename "$container")" \
              --in-place \
              --report "/tmp/conditions/wet-$(basename "$container" .tbmap).json"
            echo "::endgroup::"
          done < /tmp/region-containers.txt

      # Fords. OVERPASS IS SOMEBODY ELSE'S SERVER, and `fetch` skips a region
      # it already has, so this is a courtesy call on the slow clock.
      #
      # It is NOT wrapped in `|| true` the way the POI fetch is. A missing POI
      # leaves a rider without a fuel station they could have found another
      # way; a missing ford leaves the container claiming there is no water
      # crossing on a lane that has one, which is the direction of error this
      # whole feature exists to avoid.
      - name: Fetch the fords
        run: |
          set -euo pipefail
          mkdir -p cache/fords
          while read -r region container; do
            echo "::group::fords for $region"
            if [ "${{ inputs.refresh_conditions }}" = "true" ]; then
              python tools/build_fords.py fetch --region "$region" \
                --cache cache/fords --refresh
            else
              python tools/build_fords.py fetch --region "$region" \
                --cache cache/fords
            fi
            echo "::endgroup::"
          done < /tmp/region-containers.txt

      # The fords and the EA gauge network, kept for the same reason as the POIs
      # above: both are fetched after the council cache is saved, so neither
      # ever reached the next run.
      - name: Keep the fords and gauges for the next run
        if: always() && hashFiles('cache/authorities.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}-fords

      - name: Write the fords and their gauges into each container
        run: |
          set -euo pipefail
          while read -r region container; do
            echo "::group::fords into $container"
            # Fords and gauges keep the numbers riders hold (stable_ids.py).
            python tools/build_fords.py build \
              --region "$region" \
              --cache cache/fords \
              --container "$container" \
              --stations cache/ea/stations-level.json \
              --previous "containers/$(basename "$container")" \
              --in-place \
              --report "/tmp/conditions/fords-$(basename "$container" .tbmap).json"
            echo "::endgroup::"
          done < /tmp/region-containers.txt

      # How old the answer is, as a distribution rather than a build stamp,
      # stored as DATES: see the comment at the top of this block. Nothing
      # written here depends on today, so no `--as-of`; the printed report
      # and --report JSON count ages against today for whoever reads the log.
      - name: Record how old each container's evidence is
        run: |
          set -euo pipefail
          cut -d' ' -f2 /tmp/region-containers.txt | sort -u > /tmp/containers.txt
          xargs -a /tmp/containers.txt \
            python tools/evidence_age.py --write \
              --report /tmp/conditions/evidence-age.json

      # ===================================================================
      # THE BUILD STAMP FOLLOWS THE CONTENT - ALL OF IT.
      #
      # `built_at` is the pack's stamp: it moves when a council's ways do and
      # at no other time. Everything written after build_containers - POIs on
      # their 30-day clock, wetness and fords on the gauge network's - used to
      # change a region's bytes under the SAME `built_at`. Every changeset is
      # keyed on `built_at` (builder, validator, app), so none could cover it:
      # the app saw the build it held under a new hash and fetched the region
      # whole. stamp_build.py makes that state impossible: a container whose
      # content equals the published one IS the published file, byte for
      # byte; one that differs gets a stamp the published one does not have.
      # The changeset step below refuses the job if the two ever disagree.
      #
      # After every write above, before the re-sign below.
      - name: Stamp each build by its content
        run: |
          set -euo pipefail
          python tools/test_stamp_build.py
          python tools/stamp_build.py \
            --published containers \
            --manifest dist/containers/manifest.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # ===================================================================
      # AND PUT THE MANIFEST BACK IN STEP WITH THE FILES.
      #
      # MEASURED, on the published containers/motor-south-west.tbmap:
      #
      #     before   sha256 12f0fff663dbd006...   2,347,008 bytes
      #     after    sha256 95a7fe247a6d26e1...   2,437,120 bytes
      #
      # and dist/containers/manifest.json still said 12f0fff6 and 2347008,
      # because build_containers.py takes the digest, the sizes and the Ed25519
      # signature at the moment it finishes a container - and the four steps
      # above then write five new tables into that file.
      #
      # Left like that, every one of those containers is a download that fails
      # its own checksum: the app bins it and tells the rider it was corrupted,
      # permanently, because the file it re-fetches is always the same one. The
      # signature is worse - `unsignedIsAccepted` is false, so it downloads in
      # full, is refused at mount, and the ground reads as "not downloaded"
      # with nothing anywhere saying why.
      #
      # This is the step that makes the static half safe to ship, and
      # --require-moved is the guard against it running before the writes
      # instead of after them: if not one container's bytes moved, either the
      # pipeline above did nothing or this is in the wrong place, and both of
      # those are a green job that published nothing.
      - name: Re-hash and re-sign the containers we just wrote into
        env:
          TB_SIGNING_KEY_PEM: ${{ secrets.TB_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          python tools/test_restamp_containers.py
          python tools/restamp_containers.py \
            --manifest dist/containers/manifest.json \
            --require-moved

      # THE GUARD AGAINST A GREEN JOB THAT DID NOTHING.
      #
      # Every step above can succeed over an empty subject: `assign` on a
      # container with no ways writes an empty table and reports zero, `build`
      # on a region whose fords cache came back empty writes nothing and says
      # "0 written", and the whole block goes green having published a
      # conditions feature that answers "unknown" everywhere. That is the shape
      # of every one of the ten features this repository has shipped to nobody,
      # so it is asked of the CONTAINERS, after the fact, not of the exit codes.
      - name: Prove the containers actually carry conditions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3, sys

          # Read through an env var with the workflow's own default, so
          # tools/test_the_conditions_pipeline_is_wired_in.py can EXECUTE this
          # guard against a fixture and prove it refuses an empty one. A guard
          # that has never been watched fail is not a guard.
          listing = os.environ.get("REGION_CONTAINERS",
                                   "/tmp/region-containers.txt")
          paths = sorted({line.split(" ", 1)[1].strip()
                          for line in open(listing)
                          if line.strip()})
          if not paths:
              sys.exit("no containers to check - ZERO SUBJECTS IS BLIND, "
                       "not a pass")

          problems, fords_total = [], 0
          for path in paths:
              db = sqlite3.connect(path)
              try:
                  names = {r[0] for r in db.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'")}
                  want = {"way_wetness", "wet_gauges", "fords", "ford_gauges"}
                  absent = want - names
                  if absent:
                      problems.append("%s has no %s"
                                      % (path, ", ".join(sorted(absent))))
                      continue
                  counts = {t: db.execute("SELECT count(*) FROM %s" % t)
                              .fetchone()[0] for t in sorted(want)}
                  meta = db.execute("SELECT count(*) FROM meta WHERE key=?",
                                    ("evidence_dates",)).fetchone()[0]
              finally:
                  db.close()
              print("%-44s %s  evidence_dates=%d" % (path, counts, meta))
              fords_total += counts["fords"]
              # A wetness row PER WAY, and a gauge to join it to. Both can only
              # be zero if the container has no ways at all or no gauge within
              # 50 km of anywhere in it, and neither is true of any region of
              # England or Wales.
              if not counts["way_wetness"]:
                  problems.append("%s: way_wetness is empty" % path)
              if not counts["wet_gauges"]:
                  problems.append("%s: no rainfall gauge was carried" % path)
              if not meta:
                  problems.append("%s: no meta.evidence_dates" % path)

          # Fords are asked NATIONALLY, not per region, and that is deliberate
          # rather than lenient: a region can honestly have no ford on one of
          # our ways, and East Anglia is the obvious candidate. A country with
          # none is a broken Overpass fetch. Measured on south-west against the
          # published container: 3,031 fords in the box, 39 of them on a way we
          # carry.
          if not fords_total:
              problems.append("not one ford in the whole country - the "
                              "Overpass fetch or the on-network match is "
                              "broken, and zero fords is BLIND, not clean")
          for problem in problems:
              print("REFUSED: %s" % problem, file=sys.stderr)
          if problems:
              sys.exit(1)
          print("conditions are in %d containers, %d fords nationally"
                % (len(paths), fords_total))
          PY

      # The guard for the new format. check_build.py still guards the packs.
      #
      # It refuses a tile over 512 kB, a record in no tile, a feature in no
      # record, and a lane claimed by two areas. It caught a real one on its
      # first run - every record in every area container was invisible,
      # because the zoom table for coalescing was inverted - and a second when
      # the national footpath overview would not fit at z6.
      - name: Check the containers
        run: |
          python tools/check_containers.py dist/containers/*.tbmap

      # And the raster archives, which had no guard at all until six of the
      # ten published imagery packs turned out to be unopenable.
      #
      # Every check this pipeline had asked whether the BYTES were the bytes -
      # sha256, length, "is this a sign-in page". None asked whether the file
      # was a valid ARCHIVE, so a pack whose root directory broke the PMTiles
      # 16 KB rule passed every gate, downloaded perfectly onto a rider's
      # phone, and produced no imagery at all. A checksum proves a file
      # arrived intact; it says nothing about whether it was ever right.
      #
      # Globbed with `|| true` guards so a run that built no imagery this
      # time - most of them - does not fail on an empty glob.
      - name: Check the raster archives
        run: |
          shopt -s nullglob
          files=(satellite/*.pmtiles height/*.pmtiles dist/satellite/*.pmtiles dist/height/*.pmtiles)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no raster archives built this run"
          else
            python tools/check_pmtiles.py "${files[@]}"
          fi

      # Ready-made trips: anchors snapped to real byways in the data we
      # have just built. It REFUSES to publish a trip whose anchors it
      # cannot place on a motor-legal byway, so a transposed digit fails
      # the build instead of sending a rider to the wrong valley.
      #
      # A BAD TRIP DEFINITION MUST NOT HOLD BACK A MONTH OF LANE DATA.
      #
      # It did, for six days. Five of the eight trips have anchors with no BOAT
      # within the 6 km limit - measured: 7.0 km at Cynwyd, 8.1 km at
      # Pontrhydfendigaid, 8.1 km at Slaidburn - so this step exited 1, the job
      # stopped, and nothing published. Councils amended their maps and no
      # rider saw it, because of a handful of coordinates in a file that has
      # nothing to do with lane data.
      #
      # The guard is right and stays exactly as strict. What changes is what it
      # stops: the trips, not the refresh. The previously published trips stay
      # in place, so nobody loses one, and the failure is raised as an issue
      # rather than swallowed - which is the same bargain the rest of this
      # workflow makes.
      - name: Build the ready-made trips
        id: trips
        continue-on-error: true
        run: |
          python tools/test_build_trips.py
          python tools/build_trips.py --trips trips/gb.json --out trips

      - name: Say so if a trip could not be built
        if: steps.trips.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PUT THE PUBLISHED FILE BACK FIRST.
          #
          # build_trips.py WRITES before it refuses: the failing run logged
          # "wrote trips/gb.tbtrips: 3 trips" and then exited 1. Left there,
          # continue-on-error would publish three trips where eight were, and
          # silently losing one is the exact thing that guard exists to stop.
          git checkout -- trips/gb.tbtrips || true
          echo "::warning::Ready-made trips did not build; the previously "
          echo "::warning::published ones are unchanged. Lane data still went out."
          # Deduplicated the same way every other alarm in this repository is:
          # a job that runs monthly must not open a twelfth copy of the issue
          # nobody has closed.
          TITLE="Ready-made trips are not building"
          if [ -z "$(gh issue list --state open --search ''"$TITLE"'' --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" --body \
              "build_trips.py rejected one or more trips, so trips/gb.tbtrips was left as published. Lane data was published normally. Run the workflow logs for which anchors failed and by how far."
          fi

      # ===================================================================
      # THE CHANGESETS: WHAT A RIDER FETCHES INSTEAD OF THE COUNTRY.
      #
      # This step is the half that did not exist. `build_changeset.py` could
      # write a `.tbchange` and the app's `ContainerUpdate` could apply one,
      # and nothing in this workflow ever built one: the only changeset line
      # here was `python tools/test_build_changeset.py`, which runs the TESTS.
      # `find . -name "*.tbchange"` returned nothing and catalogue.json
      # contained zero occurrences of the word, so the app could not learn a
      # changeset existed and every update was the whole container.
      #
      # WHAT IT IS WORTH. Containers are hundreds of megabytes and this
      # workflow runs four times a day. Measured on the containers this
      # repository publishes, a twelve-lane council revision comes out at
      # 0.24% to 0.49% of the whole build - 36 kB against 15 MB. That is the
      # difference between an app a rider keeps current on a phone tether and
      # one they update at home over wifi when they remember.
      #
      # IT MUST RUN BEFORE THE CATALOGUE, because `changes/index.json` is what
      # build_catalogue.py reads to announce them - by default, so that the
      # imagery and routing jobs pick them up too rather than deleting every
      # changeset within a day, which is what happened to trips, imagery and
      # the routing mirror in turn.
      #
      # AND BEFORE THE PUBLISH STEP MOVES ANYTHING, because the diff is
      # between the containers this repository HAS published - `containers/`,
      # from the checkout - and the ones this run built in `dist/containers`.
      # After the move both are the same tree and there is nothing to diff.
      #
      # A rider two updates behind is why `--keep` exists: each run holds the
      # bytes of exactly one older build, so it can write exactly one
      # changeset, and the window is what lets the app walk 104->105->106 for
      # somebody who missed a run. Six is a day and a half at this cadence.
      #
      # NO --base-url, deliberately. The changesets are committed to this
      # repository and served beside catalogue.json, exactly as the containers
      # are, so a RELATIVE path is what the app resolves against the index's
      # own `baseUrl`. An absolute URL here would be a second place the hosting
      # is written down, and the routing mirror has already cost this
      # repository an outage for exactly that - every mirrored tile URL
      # collapsing to a bare filename against the Pages root.
      - name: Build the changesets
        env:
          TB_SIGNING_KEY_PEM: ${{ secrets.TB_SIGNING_KEY_PEM }}
        run: |
          python tools/test_publish_changesets.py
          python tools/publish_changesets.py \
            --old containers \
            --new dist/containers \
            --out changes \
            --keep 6
          # THE GATE RUNS ON THE ARTEFACTS THAT SHIP. validate_changeset.py
          # had a --selftest and nothing had ever run it over a published
          # file; publish_changesets.py checks each one as it writes it, and
          # this checks the whole retained window, including the ones earlier
          # runs left behind.
          shopt -s nullglob
          built=(changes/*/*.tbchange)
          if [ ${#built[@]} -eq 0 ]; then
            echo "no changesets in the window; every update is a whole download"
          else
            python tools/validate_changeset.py "${built[@]}"
          fi

      # Every index, not just the lanes.
      #
      # This rebuilds catalogue.json from scratch, so anything NOT passed here
      # is dropped from it. Built with --lanes alone, the first monthly refresh
      # after imagery or a mirrored routing tile was published would silently
      # delete both: riders would lose satellite from the map and go back to
      # pulling 139 MB tiles from brouter.de, with nothing in any log to say a
      # thing had changed.
      #
      # The flags are conditional because the indexes do not exist until their
      # own workflows have run once, and build_catalogue is entitled to object
      # to a path that is not there.
      - name: Build the catalogue
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          export REPO_URL
          # The checks that stand behind the catalogue, before the catalogue
          # that depends on them. A pack whose published hash does not match
          # the file this repository serves is not slightly wrong, it is
          # permanently undownloadable - the app bins every attempt and tells
          # the rider their download was corrupted. That shipped once, on the
          # ready-made trips pack, and every build stayed green.
          python tools/test_verify_catalogue.py
          bash tools/rebuild_catalogue.sh dist/manifest.json dist/catalogue.json
          # Refuses to publish a catalogue that lost something already
          # published. The catalogue is rebuilt from scratch, so a job that
          # forgets an index DELETES what another job published - silently, in
          # a build that otherwise succeeds. It has happened three times.
          python tools/verify_catalogue.py dist/catalogue.json

      # And prove it, rather than trusting the flags above. A catalogue that
      # lost every imagery pack is a build that "succeeded".
      - name: Did the rebuild keep what the other workflows published?
        run: |
          python - <<'PY'
          import json, os, sys

          cat = json.load(open("dist/catalogue.json"))
          kinds = {}
          for cont in cat.get("continents", []):
              for country in cont.get("countries", []):
                  for area in country.get("areas", []):
                      for pack in area.get("packs", []):
                          kinds[pack.get("kind")] = kinds.get(pack.get("kind"), 0) + 1
          print("rebuilt catalogue holds:", kinds)

          def published(path, key):
              if not os.path.exists(path):
                  return 0
              try:
                  return len(json.load(open(path)).get(key, []) or [])
              except (ValueError, OSError):
                  return 0

          want_sat = published("satellite/index.json", "packs")
          if want_sat and not kinds.get("basemap"):
              sys.exit("satellite/index.json lists %d packs and the rebuilt "
                       "catalogue has none - riders would lose imagery" % want_sat)

          if os.path.exists("routing/index.json"):
              try:
                  mirrored = json.load(open("routing/index.json")).get("tiles", {})
              except (ValueError, OSError):
                  mirrored = {}
              if mirrored and not kinds.get("routing"):
                  sys.exit("routing tiles vanished from the rebuilt catalogue")
          PY

      # The important one. A crash stops the job on its own; what this catches
      # is a build where every step SUCCEEDED and the data is quietly ruined -
      # a half-down source, an area that vanished, a package the app cannot
      # open. Local pack names carry no build date, so publishing one of those
      # REPLACES the good copy already on every rider's phone.
      - name: Would this build make things worse?
        run: |
          # The guard's own tests first. It is the only thing standing between
          # a short fetch and every rider's map, so "it ran" is not enough.
          python tools/test_check_build.py
          python tools/check_build.py \
            --previous manifest.json \
            --new dist/manifest.json \
            --cache cache \
            --dist dist/packages \
            --key /tmp/dataset.key \
            ${{ inputs.force && '--force' || '' }}

      - name: Check the app could read the catalogue
        run: |
          python - <<'PY'
          import json, sys

          catalogue = json.load(open('dist/catalogue.json'))
          if catalogue.get('schema') != 2:
              sys.exit('catalogue is not schema 2')

          countries = [c for cont in catalogue['continents']
                       for c in cont['countries']]
          if len(countries) < 20:
              sys.exit('only %d countries; something went wrong upstream'
                       % len(countries))

          # Every pack must be checkable after download, or the app refuses it
          # and a rider sees "could not be checked" instead of a map.
          #
          # And every CONTAINER must carry a signature. The app's
          # `unsignedIsAccepted` is now false: an unsigned container downloads
          # in full, is refused at mount, and its ground reads as "not
          # downloaded" - so the rider pays for the bytes and gets an empty
          # map, with nothing anywhere saying why. This check ran for a year
          # asking only about sha256, which was right while the transitional
          # rule stood and became a hole the day it was dropped.
          unsigned = []
          for country in countries:
              for area in country['areas']:
                  for pack in area['packs']:
                      if not pack.get('sha256') and not pack.get('bytes'):
                          sys.exit('unverifiable pack: %s' % pack['id'])
                      if pack.get('format') == 'tbmap'                               and not pack.get('signature'):
                          unsigned.append(pack['id'])
          if unsigned:
              sys.exit('%d containers carry no signature, and the app refuses '
                       'those outright: %s'
                       % (len(unsigned), ', '.join(sorted(unsigned)[:8])))

          gb = [c for c in countries if c['code'] == 'GB']
          if not gb or len(gb[0]['areas']) < 5:
              sys.exit('Great Britain lost its regions')

          # A region a rider downloads must bring its overview with it, or the
          # map is empty every time they zoom out past z11.
          #
          # The overviews were published, signed, and listed in their own
          # top-level section - which nothing downloads from. The app builds
          # its pack list from an area's `packs`, and `packsForArea` only
          # reaches into another area for `routing`. So this asks the question
          # the way the app does: standing in this region, is the overview for
          # my vehicle among the packs I would be offered?
          # BOTH SHAPES, and the hyphen is the whole reason this is written
          # out rather than a prefix test. Before the pivot every overview
          # was `gb-overview-<vehicle>`; after it there is ONE overview with
          # the id `gb-overview` and no `vehicle` key at all, because step
          # 1.7 removes it. `startswith('gb-overview-')` is false for that
          # id, so the single overview was counted as an ordinary lane pack,
          # covered nothing, and `missing` came out as {None}.
          #
          # The failure was not even the honest one: `', '.join(sorted({None}))`
          # raises TypeError, so the cutover build died with a stack trace
          # instead of the sentence this check exists to print. A gate that
          # crashes tells you less than a gate that fails.
          def _is_overview(p):
              return p['id'] == 'gb-overview' or p['id'].startswith('gb-overview-')

          for area in gb[0]['areas']:
              lane_vehicles = {p.get('vehicle') for p in area['packs']
                               if p.get('kind') == 'lanes'
                               and not _is_overview(p)}
              if not lane_vehicles:
                  continue
              covered = {p.get('vehicle') for p in area['packs']
                         if _is_overview(p)}
              missing = lane_vehicles - covered
              if missing:
                  # `str(v)` because a post-pivot pack has no vehicle: the
                  # value is None and None does not sort against a string.
                  sys.exit('%s offers lanes for %s with no overview to draw '
                           'them zoomed out'
                           % (area['id'],
                              ', '.join(sorted(str(v) for v in missing))))

              # And every lane pack must say it is the official record. This
              # is not bookkeeping: `legalBasis` is the difference between a
              # council's definitive map and somebody's idea of where a byway
              # goes, and the app shows it to riders. The overviews shipped
              # without it once, and it took a test in the APP, reading the
              # already-published catalogue, to notice.
              for pack in area['packs']:
                  if pack.get('kind') != 'lanes':
                      continue
                  if pack.get('legalBasis') != 'official':
                      sys.exit('%s in %s does not say it is the official '
                               'record (legalBasis=%r)'
                               % (pack['id'], area['id'],
                                  pack.get('legalBasis')))

          print('catalogue OK: %d countries' % len(countries))
          PY

      # Nothing below here runs unless every check above passed.
      #
      # AND NOTHING BELOW HERE RUNS AT ALL UNDER `dry_run`, which is the
      # whole point of that input. The cutover rehearsal asked for a build
      # taken through the full gate chain with nothing published, and there
      # was no way to do it: this workflow builds and publishes in one
      # breath, and `force` only makes it publish HARDER.
      #
      # So a rehearsal meant either trusting the gates untested against a
      # real build, or publishing to find out. On the one step in this
      # repository that cannot be undone.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          # Scaffolding for check_build, never published beside the packs.
          rm -f dist/packages/*.sha256

          # Did this build actually produce anything new?
          #
          # Asked of the PACKS, before anything is moved, because they are what
          # a rider pays to download. The build is reproducible now - the nonce
          # is derived from the payload and a package whose lanes have not
          # changed keeps the date it was cut - so identical council data
          # rebuilds to identical bytes and this comparison is exact.
          #
          # It used to be asked of `git diff --cached` after the move, and it
          # could never say yes: every pack carried a random nonce and the
          # build date in its filename, so every monthly run wrote ~100 MB of
          # new paths with new hashes and every rider re-downloaded the lot to
          # arrive at the same lanes they already had.
          #
          # manifest.json and catalogue.json are deliberately NOT part of the
          # question and are not moved when the answer is no. Both carry a
          # `generated` stamp, and the catalogue also carries routing tile
          # sizes that upstream rebuilds nightly, so both differ on every run
          # whatever the lanes did - which is precisely what made this
          # unanswerable before. Holding them back costs nothing: the imagery
          # and routing-mirror workflows rebuild and commit the catalogue on
          # their own clocks, and each pack's `generated` is shown to riders as
          # the date their lane data was CUT. Advancing that monthly over data
          # that never moved told them their map was fresher than it was.
          #
          # The trips pack is in the question because it is published by this
          # job and its hash is carried in the catalogue: publishing a rebuilt
          # trips pack against a held-back catalogue would hand riders a
          # download that fails its own checksum.
          # `changes` is in the question with `git status`, not `git diff`,
          # because on the first run after changesets existed the whole tree is
          # UNTRACKED and `git diff` cannot see it. Left out, the first run
          # whose containers happened to be identical would build the changes
          # index, exit here without committing it, and do the same thing again
          # six hours later - the join present in every run and published in
          # none, which is the shape of the defect this whole feature is.
          #
          # It cannot cause a needless publish: nothing is written into
          # `changes` unless a container's built_at actually moved, and
          # index.json carries no run stamp for exactly that reason.
          if [ -d packages ] \
             && diff -rq packages dist/packages >/dev/null 2>&1 \
             && [ -d containers ] \
             && diff -rq containers dist/containers >/dev/null 2>&1 \
             && [ -z "$(git status --porcelain -- changes)" ] \
             && git diff --quiet -- trips/gb.tbtrips; then
            echo "Councils published nothing new. Leaving the last build in place."
            echo "Every pack is byte-identical to the published one, so nobody"
            echo "re-downloads anything and the cut dates riders see stay true."
            exit 0
          fi

          rm -rf packages
          mv dist/packages packages
          # The containers are what riders download; the packs stay as the
          # thing they were built from and as the diff above's subject.
          rm -rf containers
          mv dist/containers containers
          mv dist/manifest.json manifest.json
          mv dist/catalogue.json catalogue.json

          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A packages containers changes manifest.json catalogue.json trips/gb.tbtrips

          # The lane count is the number worth seeing in the commit list: it is
          # the one that moves when a council amends its map.
          LANES=$(python -c "import json;print(sum(p['laneCount'] for p in json.load(open('manifest.json'))['packages']))")
          git commit -m "Refresh lane data: ${LANES} ways" \
                     -m "Rebuilt from local highway authority definitive maps via rowmaps.com."
          # STILL NO REBASE, and for the reason that was always right: a
          # generated file does not merge, it has a recipe. catalogue.json is
          # rebuilt whole by both sides, so rebasing conflicts every time by
          # construction, stops mid-way, and the retry runs `git pull` into an
          # unresolved conflict. That is how the satellite job turned a
          # recoverable push race into a detached HEAD.
          #
          # What changed is the cost of losing. "A rejected push costs one
          # cycle and nothing else" was true at a monthly cadence over packs.
          # It now throws away ~25 minutes of container building, and the race
          # got likelier: any ordinary commit to main while a run is in flight
          # loses it. One did.
          #
          # So: re-anchor rather than merge. Take the new remote tip, keep OUR
          # generated files whole, stage nothing else. That is ours-wins for
          # exactly the paths the recipe rebuilds - which is sound BECAUSE
          # they are rebuilt whole - while a commit to any other path survives
          # untouched. `git reset` (mixed) moves HEAD and the index to the new
          # tip and leaves the working tree alone, so re-adding only the
          # generated paths stages our output against it and nothing else.
          GENERATED="packages containers changes manifest.json catalogue.json trips/gb.tbtrips"
          for attempt in 1 2 3; do
            if git push; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; re-anchoring on the new tip (attempt ${attempt})"
            git fetch origin main || exit 1
            git reset origin/main || exit 1
            git add -A ${GENERATED} || exit 1
            # Nothing left to say once someone else published the same bytes.
            if git diff --cached --quiet; then
              echo "the remote already has this build; nothing to publish"
              exit 0
            fi
            git commit -m "Refresh lane data: ${LANES} ways"                        -m "Rebuilt from local highway authority definitive maps via rowmaps.com."               || exit 1
          done
          echo "could not publish after 3 attempts; the next run will carry it"
          exit 1

      # An email is easy to miss and impossible to reply to. An issue is
      # visible, has the log linked, and can be closed when it is dealt with.
      - name: Raise an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data refresh failed on $(date -u +%Y-%m-%d)"
          BODY=$(cat <<EOF
          The monthly data refresh did not complete, so **nothing was
          published**. Every rider keeps the data they already have — this is
          the safe outcome, not an outage.

          Log: $RUN_URL

          Most likely causes, in order:

          - **rowmaps.com was down or slow.** The safety check refuses to
            publish a partial map. Re-run the workflow when it is back.
          - **DATASET_KEY_B64 is missing or wrong.** It must be the same key
            the shipped app was built with.
          - **A genuine large change in the data.** Read what the check
            objected to. If the drop is real, re-run with \`force\` ticked.

          Re-run from the Actions tab. Close this once it has gone green.
          EOF
          )
          # One open issue at a time: a source down for three months should not
          # produce three identical issues.
          EXISTING=$(gh issue list --label data-refresh --state open \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create data-refresh --color B60205 \
              --description "Automated data refresh problems" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label data-refresh
          fi

      # AND STAND IT DOWN AGAIN.
      #
      # Nothing closed these. Two of the three issues open on 16 September were
      # for faults that had already fixed themselves - satellite had succeeded
      # several times since its issue was raised - and an alarm that never
      # resets is one people learn to scroll past, which is the failure the
      # alarm exists to prevent.
      - name: Stand the alarm down if this worked
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label data-refresh --state open \
                       --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "Fixed: $RUN_URL succeeded." || true
          done

  # =====================================================================
  # THE CONDITIONS PIPELINE, LIVE HALF. A SEPARATE JOB, ON PURPOSE.
  #
  # What the container holds is which lane is soft and where the fords are;
  # what this publishes is how much rain has fallen and how high the rivers
  # are. The first is ~190 MB and must not move; the second is kilobytes and
  # must move every six hours. Two clocks, and the split between them is the
  # whole design - see the STATIC half in the job above.
  #
  # `needs: refresh` with `if: always()` is doing two different things:
  #
  #   * SERIALISING THE PUSH. Both jobs commit to main. Run in parallel they
  #     would race, and the refresh job's own comments record what a lost race
  #     costs now that a run is 25 minutes of container building. Waiting is
  #     free here: this job is three minutes.
  #   * AND STILL RUNNING WHEN THE LANE BUILD FAILED. The feeds have nothing to
  #     do with whether rowmaps.com was up. A council's server being down must
  #     not also stop a rider being told the ford is in flood - that is the
  #     same bargain the ready-made trips step makes, in the other direction.
  #
  # NO SECRET, AND THAT IS CHECKED RATHER THAN HOPED. The EA's
  # flood-monitoring API is Open Government Licence v3 and needs no key or
  # registration, Overpass is not called here, and the feeds are plain JSON
  # rather than sealed packs - so nothing in this job can fail on a secret that
  # only exists on the scheduled run, which is how a 15-minute fetch was once
  # thrown away by a missing DATASET_KEY_B64.
  #
  # MEASURED COST, so the figure is on the record rather than assumed: the
  # south-west wet feed is 24 kB (221 gauges reporting) and its river feed is
  # 3.4 kB (18 gauges, restricted to those a ford actually references). Six
  # regions is ~165 kB a run and ~20 MB a month of git history. That is an
  # order of magnitude under the 3 MB-per-run traffic-orders pack that was
  # moved out to a release asset for exactly this reason, so it stays in git
  # for now - but it is the number to revisit first if the history gets heavy,
  # and restricting the wet feed to gauges a way references (as the river feed
  # already does) is the obvious lever.
  conditions:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # THE TIP, NOT THE TRIGGERING COMMIT. `actions/checkout` defaults to
          # `github.sha`, which on a schedule is main as it stood when the cron
          # fired - i.e. BEFORE the refresh job above pushed. Checking that out
          # would rebuild the catalogue from last run's containers and push it
          # over the one just published, deleting a build nobody would see go.
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # SAME DEPENDENCY AS THE REFRESH JOB, and it was missing here.
      #
      # `build_fords.py` imports `build_map_container` for GEOMETRY_SCALE, and
      # that module imports AESGCM at the top - so the live half of the
      # conditions pipeline died on `ModuleNotFoundError: cryptography` the
      # first time it ran on the schedule, AFTER publishing the rain feed and
      # before the rivers. A half-published pair is the one state the two
      # clocks were designed to avoid.
      #
      # Two jobs, two environments: anything the refresh job installs and this
      # one runs has to be installed twice, and nothing was checking that.
      - name: Install dependencies
        run: pip install --quiet cryptography

      # Read-only: this job never writes the cache. The refresh job owns it,
      # and two jobs saving one key is a race over whose copy survives.
      - name: Restore the council data cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}
          restore-keys: rowmaps-

      # The gauge network belongs to the STATIC half and is normally restored
      # above. Fetched here only when it is not - the first run, or a cache
      # eviction - because a live feed cannot be built without knowing where
      # the gauges are, and failing instead would make this job depend on the
      # other one having succeeded, which `if: always()` exists to avoid.
      - name: Make sure we know where the gauges are
        run: |
          set -euo pipefail
          mkdir -p cache/ea
          for parameter in rainfall level; do
            if [ -s "cache/ea/stations-$parameter.json" ]; then
              echo "$parameter station list restored from the cache"
            else
              echo "no cached $parameter stations; fetching (first run, or the"
              echo "cache was evicted). Two requests."
              python tools/ea_flood.py stations --parameter "$parameter" \
                --out cache/ea
            fi
          done

      # Rainfall is ACCUMULATED and needs the window; a river level is a state
      # and needs only the latest reading - ea_flood.py knows the difference
      # and `--days` only bites on rainfall. Two days, because what cuts a
      # byway up is saturated ground rather than a shower, and build_wet's
      # window is 48 hours.
      - name: Read the gauges
        run: |
          set -euo pipefail
          python tools/ea_flood.py readings --parameter rainfall \
            --stations cache/ea/stations-rainfall.json \
            --days 2 --out cache/ea
          python tools/ea_flood.py readings --parameter level \
            --stations cache/ea/stations-level.json \
            --days 2 --out cache/ea

      # NOTHING BELOW TOUCHES A CONTAINER. `build_fords.py feed --container`
      # READS one - to restrict the feed to the gauges a ford actually
      # references, which is what takes the river feed from 40 kB to 3 kB - and
      # never writes to it. The published `containers/` tree is deliberate: the
      # feed must describe the containers riders HAVE, not ones dist/ might
      # have built and not published.
      #
      # NOT GATED ON `dry_run`, despite the name it used to have. This step
      # writes files into the working tree and nothing else; the commit and
      # push are the `Publish` step below, which IS gated. Gating this one too
      # meant a dry run built no feeds, and the proof step below then refused
      # twelve feeds that had never been asked for - the first cutover
      # rehearsal failed on exactly that, and taught nothing about the feeds.
      - name: Build the live rain and river feeds
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/region-containers.txt
          import json, os, sys
          sys.path.insert(0, "tools")
          import build_pois as PO

          areas = []
          if os.path.exists("containers/manifest.json"):
              areas = [c for c in json.load(
                  open("containers/manifest.json", encoding="utf-8")
              )["containers"] if c.get("kind") == "area"]
          for region in sorted(PO.REGIONS):
              hits = [c["file"] for c in areas if c.get("area") == region]
              # A region with no published container still gets a feed. It has
              # to: the feed is what a rider reads, and one published before
              # the container simply carries every gauge in the box until the
              # container arrives to narrow it. Silence here would be the
              # feature not shipping again.
              print("%s %s" % (region, hits[0] if hits else "-"))
          PY
          while read -r region container; do
            echo "::group::conditions for $region"
            python tools/build_wet.py feed \
              --region "$region" \
              --stations cache/ea/stations-rainfall.json \
              --readings cache/ea/readings-rainfall.json \
              --out published/wet
            if [ "$container" = "-" ]; then
              echo "  no published container for $region yet; every gauge in"
              echo "  the box goes in the river feed until there is one"
              python tools/build_fords.py feed \
                --region "$region" \
                --stations cache/ea/stations-level.json \
                --readings cache/ea/readings-level.json \
                --out published/rivers
            else
              python tools/build_fords.py feed \
                --region "$region" \
                --stations cache/ea/stations-level.json \
                --readings cache/ea/readings-level.json \
                --container "$container" \
                --out published/rivers
            fi
            echo "::endgroup::"
          done < /tmp/region-containers.txt

      # THE GUARD AGAINST A GREEN JOB THAT DID NOTHING, asked of the FILES.
      #
      # Every step above exits 0 over an empty subject. `readings` on a station
      # list that came back empty writes a readings file with no stations;
      # `feed` over that writes a feed with `"stations": {}` - valid JSON, the
      # right shape, and it tells every rider "we do not know" about every
      # gauge in the country, four times a day, greenly. A feed with no
      # stations is BLIND, not clean, and it must fail the job.
      - name: Prove the feeds are not empty
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "tools")
          import build_pois as PO

          problems, totals = [], {}
          for kind, where in (("wet", "published/wet"),
                              ("rivers", "published/rivers")):
              seen = 0
              for region in sorted(PO.REGIONS):
                  path = os.path.join(where, "%s.json" % region)
                  if not os.path.exists(path):
                      problems.append("%s was not published for %s"
                                      % (kind, region))
                      continue
                  body = json.load(open(path, encoding="utf-8"))
                  n = len(body.get("stations") or {})
                  print("%-7s %-12s %4d gauges, as of %s, %d bytes"
                        % (kind, region, n, body.get("as_of"),
                           os.path.getsize(path)))
                  if body.get("region") != region:
                      problems.append("%s says it is for %r, not %s"
                                      % (path, body.get("region"), region))
                  if not body.get("as_of"):
                      problems.append("%s carries no as_of, so the app cannot "
                                      "tell fresh from stale" % path)
                  seen += n
              totals[kind] = seen
              # PER COUNTRY, NOT PER REGION. A region can honestly have no
              # river gauge reporting for an hour; a country with none is the
              # EA being down or our fetch being broken, and the two must not
              # produce the same green job.
              if not seen:
                  problems.append("not one %s gauge reported anywhere in the "
                                  "country - ZERO SUBJECTS IS BLIND, NOT A "
                                  "PASS" % kind)
          for problem in problems:
              print("REFUSED: %s" % problem, file=sys.stderr)
          if problems:
              sys.exit(1)
          print("feeds OK: %s" % totals)
          PY

      # ONE COMMIT, FEEDS AND CATALOGUE TOGETHER, and that is not tidiness.
      #
      # The `conditions` block carries each feed's size and sha256 so the app
      # can check a download before trusting it - the same bargain every pack
      # makes. A feed republished four times a day against a catalogue rebuilt
      # on some other clock would be a hash that is wrong within hours, and a
      # rider would be told their download was corrupted every time. The two
      # are written, verified and pushed as one change or not at all.
      #
      # rebuild_catalogue.sh is THE only way any workflow may rebuild this
      # file, and it needs no new line for the feeds: build_catalogue.py's
      # `--conditions` defaults to `published`, exactly as `--satellite` and
      # `--tro` default to their indexes. A flag the script had to remember is
      # a flag some other job forgets, which is how imagery, the trips pack and
      # the routing mirror were each deleted by a build that succeeded.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
          python tools/verify_catalogue.py dist/catalogue.json
          python tools/validate_catalogue.py dist/catalogue.json

          # And prove the feeds reached it, rather than trusting the rebuild.
          # A catalogue whose conditions block is empty is exactly what this
          # whole job exists to stop, and it is a build that "succeeded".
          python - <<'PY'
          import hashlib, json, os, sys
          import urllib.parse

          catalogue = json.load(open("dist/catalogue.json", encoding="utf-8"))
          block = catalogue.get("conditions")
          if block is None:
              sys.exit("the rebuilt catalogue has no `conditions` key at all - "
                       "build_catalogue.py is older than this workflow")
          feeds = block.get("feeds") or []
          if not feeds:
              sys.exit("the rebuilt catalogue lists NO condition feeds, and "
                       "published/ is full of them. The app would never find "
                       "one, which is this pipeline not shipping all over "
                       "again.")
          base = catalogue.get("baseUrl") or ""
          for feed in feeds:
              rel = feed["file"][len(base):] if feed["file"].startswith(base) \
                  else urllib.parse.urlparse(feed["file"]).path.lstrip("/")
              if not os.path.exists(rel):
                  sys.exit("%s is listed at %s and there is no such file here"
                           % (feed["id"], feed["file"]))
              raw = open(rel, "rb").read()
              if hashlib.sha256(raw).hexdigest() != feed["sha256"]:
                  sys.exit("%s: the catalogue's hash is not the file's. The "
                           "app refuses a download whose hash does not match, "
                           "so this would be published and undownloadable."
                           % feed["id"])
              if len(raw) != feed["bytes"]:
                  sys.exit("%s: the catalogue's size is not the file's"
                           % feed["id"])
          print("%d condition feeds listed, and every hash matches the file"
                % len(feeds))
          PY

          mv dist/catalogue.json catalogue.json
          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A published catalogue.json
          if git diff --cached --quiet; then
            echo "the gauges have not moved since the last run; nothing to say"
            exit 0
          fi
          git commit -m "Conditions: rain and river levels" \
                     -m "Environment Agency flood-monitoring data, OGL v3."

          # The same re-anchor the refresh job uses, for the same reason: a
          # generated file does not merge, it has a recipe. catalogue.json is
          # rebuilt whole by both sides, so a rebase conflicts by construction.
          GENERATED="published catalogue.json"
          for attempt in 1 2 3; do
            if git push; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; re-anchoring on the new tip (attempt ${attempt})"
            git fetch origin main || exit 1
            git reset origin/main || exit 1
            git add -A ${GENERATED} || exit 1
            if git diff --cached --quiet; then
              echo "the remote already has these feeds; nothing to publish"
              exit 0
            fi
            git commit -m "Conditions: rain and river levels" \
                       -m "Environment Agency flood-monitoring data, OGL v3." \
              || exit 1
          done
          echo "could not publish after 3 attempts; the next run carries it"
          exit 1
