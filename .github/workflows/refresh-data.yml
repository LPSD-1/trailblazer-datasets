name: Refresh lane data

# Free: GitHub Actions has no minute limit on public repositories, and this
# repository is public because the app has to download from it without
# credentials.
#
# Monthly, because that is roughly how often councils amend a definitive map.
# Running it weekly would republish 100 MB of near-identical packages and make
# every rider re-download them for nothing.
on:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Reuse the cached council data instead of re-fetching'
        type: boolean
        default: false
      force:
        description: 'Publish even if the safety checks object (read them first)'
        type: boolean
        default: false

permissions:
  contents: write   # to commit the rebuilt packages
  issues: write     # to raise one when a run fails

concurrency:
  group: refresh-data
  cancel-in-progress: false   # never interrupt a run mid-publish

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The fetch alone is ~25 minutes across 149 authorities, paced so we are
    # not hammering rowmaps.com. The default 6h ceiling is ample; this guards
    # against a hung request holding a runner all day.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet cryptography

      # The fetch is resumable and skips authorities it already has, so a
      # cached copy turns a 25-minute step into seconds and only picks up
      # what changed.
      - name: Restore the council data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: rowmaps-${{ github.run_id }}
          restore-keys: rowmaps-

      - name: Fetch rights of way
        if: ${{ !inputs.skip_fetch }}
        run: python tools/fetch_rights_of_way.py

      - name: Write the packaging key
        env:
          # Repository secret. Public repositories do not expose secrets to
          # forked pull requests, and nothing here runs on pull_request.
          DATASET_KEY_B64: ${{ secrets.DATASET_KEY_B64 }}
        run: |
          if [ -z "$DATASET_KEY_B64" ]; then
            echo "::error::DATASET_KEY_B64 is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "It must be the same key the shipped app was built with, or"
            echo "every rider's packages will stop opening."
            exit 1
          fi
          printf '%s' "$DATASET_KEY_B64" > /tmp/dataset.key
          # 32 bytes, base64 encoded, is 44 characters with padding.
          test "$(wc -c < /tmp/dataset.key)" -ge 43

      # The build now REFUSES to publish if any lane falls outside every
      # region box. Such a lane is in the source data, in no package and on
      # nobody's phone, and nothing used to say so.
      - name: Build the packages
        run: |
          python tools/test_build_packages.py
          python tools/build_packages.py --key /tmp/dataset.key

      # Ready-made trips: anchors snapped to real byways in the data we
      # have just built. It REFUSES to publish a trip whose anchors it
      # cannot place on a motor-legal byway, so a transposed digit fails
      # the build instead of sending a rider to the wrong valley.
      - name: Build the ready-made trips
        run: |
          python tools/test_build_trips.py
          python tools/build_trips.py --trips trips/gb.json --out trips

      # Every index, not just the lanes.
      #
      # This rebuilds catalogue.json from scratch, so anything NOT passed here
      # is dropped from it. Built with --lanes alone, the first monthly refresh
      # after imagery or a mirrored routing tile was published would silently
      # delete both: riders would lose satellite from the map and go back to
      # pulling 139 MB tiles from brouter.de, with nothing in any log to say a
      # thing had changed.
      #
      # The flags are conditional because the indexes do not exist until their
      # own workflows have run once, and build_catalogue is entitled to object
      # to a path that is not there.
      - name: Build the catalogue
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          export REPO_URL
          bash tools/rebuild_catalogue.sh dist/manifest.json dist/catalogue.json
          # Refuses to publish a catalogue that lost something already
          # published. The catalogue is rebuilt from scratch, so a job that
          # forgets an index DELETES what another job published - silently, in
          # a build that otherwise succeeds. It has happened three times.
          python tools/verify_catalogue.py dist/catalogue.json

      # And prove it, rather than trusting the flags above. A catalogue that
      # lost every imagery pack is a build that "succeeded".
      - name: Did the rebuild keep what the other workflows published?
        run: |
          python - <<'PY'
          import json, os, sys

          cat = json.load(open("dist/catalogue.json"))
          kinds = {}
          for cont in cat.get("continents", []):
              for country in cont.get("countries", []):
                  for area in country.get("areas", []):
                      for pack in area.get("packs", []):
                          kinds[pack.get("kind")] = kinds.get(pack.get("kind"), 0) + 1
          print("rebuilt catalogue holds:", kinds)

          def published(path, key):
              if not os.path.exists(path):
                  return 0
              try:
                  return len(json.load(open(path)).get(key, []) or [])
              except (ValueError, OSError):
                  return 0

          want_sat = published("satellite/index.json", "packs")
          if want_sat and not kinds.get("basemap"):
              sys.exit("satellite/index.json lists %d packs and the rebuilt "
                       "catalogue has none - riders would lose imagery" % want_sat)

          if os.path.exists("routing/index.json"):
              try:
                  mirrored = json.load(open("routing/index.json")).get("tiles", {})
              except (ValueError, OSError):
                  mirrored = {}
              if mirrored and not kinds.get("routing"):
                  sys.exit("routing tiles vanished from the rebuilt catalogue")
          PY

      # The important one. A crash stops the job on its own; what this catches
      # is a build where every step SUCCEEDED and the data is quietly ruined -
      # a half-down source, an area that vanished, a package the app cannot
      # open. Local pack names carry no build date, so publishing one of those
      # REPLACES the good copy already on every rider's phone.
      - name: Would this build make things worse?
        run: |
          python tools/check_build.py \
            --previous manifest.json \
            --new dist/manifest.json \
            --cache cache \
            --dist dist/packages \
            --key /tmp/dataset.key \
            ${{ inputs.force && '--force' || '' }}

      - name: Check the app could read the catalogue
        run: |
          python - <<'PY'
          import json, sys

          catalogue = json.load(open('dist/catalogue.json'))
          if catalogue.get('schema') != 2:
              sys.exit('catalogue is not schema 2')

          countries = [c for cont in catalogue['continents']
                       for c in cont['countries']]
          if len(countries) < 20:
              sys.exit('only %d countries; something went wrong upstream'
                       % len(countries))

          # Every pack must be checkable after download, or the app refuses it
          # and a rider sees "could not be checked" instead of a map.
          for country in countries:
              for area in country['areas']:
                  for pack in area['packs']:
                      if not pack.get('sha256') and not pack.get('bytes'):
                          sys.exit('unverifiable pack: %s' % pack['id'])

          gb = [c for c in countries if c['code'] == 'GB']
          if not gb or len(gb[0]['areas']) < 5:
              sys.exit('Great Britain lost its regions')

          print('catalogue OK: %d countries' % len(countries))
          PY

      # Nothing below here runs unless every check above passed.
      - name: Publish
        run: |
          rm -rf packages
          mv dist/packages packages
          rm -f packages/*.sha256
          mv dist/manifest.json manifest.json
          mv dist/catalogue.json catalogue.json

          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A packages manifest.json catalogue.json trips/gb.tbtrips

          if git diff --cached --quiet; then
            echo "Councils published nothing new. Leaving the last build in place."
            exit 0
          fi

          # The lane count is the number worth seeing in the commit list: it is
          # the one that moves when a council amends its map.
          LANES=$(python -c "import json;print(sum(p['laneCount'] for p in json.load(open('manifest.json'))['packages']))")
          git commit -m "Refresh lane data: ${LANES} ways" \
                     -m "Rebuilt from local highway authority definitive maps via rowmaps.com."
          git push

      # An email is easy to miss and impossible to reply to. An issue is
      # visible, has the log linked, and can be closed when it is dealt with.
      - name: Raise an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Data refresh failed on $(date -u +%Y-%m-%d)"
          BODY=$(cat <<EOF
          The monthly data refresh did not complete, so **nothing was
          published**. Every rider keeps the data they already have — this is
          the safe outcome, not an outage.

          Log: $RUN_URL

          Most likely causes, in order:

          - **rowmaps.com was down or slow.** The safety check refuses to
            publish a partial map. Re-run the workflow when it is back.
          - **DATASET_KEY_B64 is missing or wrong.** It must be the same key
            the shipped app was built with.
          - **A genuine large change in the data.** Read what the check
            objected to. If the drop is real, re-run with \`force\` ticked.

          Re-run from the Actions tab. Close this once it has gone green.
          EOF
          )
          # One open issue at a time: a source down for three months should not
          # produce three identical issues.
          EXISTING=$(gh issue list --label data-refresh --state open \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create data-refresh --color B60205 \
              --description "Automated data refresh problems" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label data-refresh
          fi
