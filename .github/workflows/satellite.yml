name: Build satellite imagery

# Daily, and it decides for itself whether there is anything to do.
#
# One AREA per run, and since the move to z14 an area may take more than one.
# Counted from the tool's own tile maths rather than remembered:
#
#              z0-13    z0-14
#   east-anglia  3,983   15,295     south-east   5,013   19,358
#   wales        6,767   26,675     midlands     6,859   26,854
#   south-west   8,580   34,124     north       13,682   53,778
#
# The budget is 55,000, sized to the North so every region still fits in one
# run - that is what splitting by area was for. Six areas, six runs, and at
# twice daily that is three days; after which the job idles until the oldest
# pack is 25 days old.
#
# Both tiers come out of one fetch: a z0-14 archive contains z0-13, so this
# publishes Standard and High detail without fetching anything twice. Together
# they are roughly 3.9 GB of release assets for Britain.
#
# Nothing here needs a human. It picks the area, fetches it, packages it,
# publishes it, records it and stops. A run that finds nothing due exits in
# seconds having spent no bandwidth.
on:
  schedule:
    # Twice daily while Britain is being brought up to two tiers from nothing:
    # six areas at one run each is three days rather than six. Put back to a
    # single nightly run once the first full pass has landed - past that the
    # job is only refreshing packs older than 25 days and has no reason to ask
    # a free service for more than one area a night.
    - cron: '41 2 * * *'    # 02:41 UTC, off the hour to be a good citizen
    - cron: '41 14 * * *'   # and again mid-afternoon UTC
  workflow_dispatch:
    inputs:
      area:
        description: 'Force a particular area id (blank = whatever is due)'
        type: string
        default: ''
      max_zoom:
        description: 'Maximum zoom. 13 is Sentinel-2 native; 14 is 2x oversampled and publishes both tiers.'
        type: string
        default: '14'

permissions:
  contents: write   # to commit the record and upload the release asset
  issues: write     # to raise one when a run fails

concurrency:
  group: satellite
  cancel-in-progress: false   # never interrupt a run mid-publish

jobs:
  imagery:
    runs-on: ubuntu-latest
    # SIZED AGAINST THE BUDGET, not against an area. It was 180 minutes when
    # the largest area was 13,682 tiles at z13 and a run was "under an hour".
    # At z14 a full-budget run is 40,000 tiles — roughly three hours at the
    # same polite rate — so 180 was about to start timing out the nightly job
    # on the larger regions, on the first night this ran.
    #
    # 350 leaves real headroom under GitHub's own six-hour ceiling. The guard
    # it provides is still the one that matters: a hung request must not hold
    # a runner all day.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet Pillow

      # Cheap, and it guards a number nobody ever sees: the app picks the
      # coarsest tier for any rider who has not chosen one, by sorting on
      # `groundMetresPerPixel`. Written the wrong way round, every such rider
      # silently gets the largest file published instead of the smallest.
      - name: Check the imagery tiers
        run: python tools/test_build_satellite.py

      # Which area, if any. The plan is derived from the catalogue's own
      # areas, so adding a lane region adds an imagery region with no second
      # list to keep in step.
      - name: What is due?
        id: plan
        run: |
          if [ -n "${{ inputs.area }}" ]; then
            PLAN=$(python tools/satellite_plan.py --catalogue catalogue.json \
                     --refresh-after-days 0 \
                     --max-zoom "${{ inputs.max_zoom || '14' }}")
            PLAN=$(python - "$PLAN" "${{ inputs.area }}" <<'PY'
          import json, sys
          plan = json.loads(sys.argv[1])
          # A forced run still goes through the planner, so the bounds and the
          # ids come from the same place as an automatic one.
          if plan.get("work") and not plan["id"].startswith(sys.argv[2]):
              plan = {"work": False, "why": "forced area %s is not the one due"
                                            % sys.argv[2]}
          print(json.dumps(plan))
          PY
          )
          else
            # THE DEFAULT MATTERS HERE. `inputs` exist only for a manual
            # dispatch, so on the nightly SCHEDULE this expanded to an empty
            # string and argparse rejected it:
            #
            #   satellite_plan.py: error: argument --max-zoom: invalid int
            #   value: ''
            #
            # Every scheduled run has died on that line nine seconds in and
            # raised an issue saying the build failed. Both packs published so
            # far were built by hand, and this workflow's own header promising
            # a full pass "in under a week" had never once been true.
            PLAN=$(python tools/satellite_plan.py --catalogue catalogue.json \
                     --max-zoom "${{ inputs.max_zoom || '14' }}")
          fi
          echo "$PLAN"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "work=$(echo "$PLAN" | python -c 'import json,sys;print(str(json.load(sys.stdin).get("work",False)).lower())')" >> "$GITHUB_OUTPUT"
          echo "id=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')" >> "$GITHUB_OUTPUT"
          echo "area=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin).get("area",""))')" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.plan.outputs.work != 'true'
        run: echo "Everything is current. No bandwidth spent."

      # Resumption rests on a run SUCCEEDING, not on surviving a failure.
      #
      # This said "survives a failed job". It does not: actions/cache declares
      # `post-if: success()`, so a job that fails saves nothing and the next
      # night starts from an empty staging directory. What actually makes a
      # multi-night area work is that a run which merely exhausts its budget
      # EXITS ZERO - it prints what is left and stops - so the cache is written
      # and the next run picks it up.
      #
      # Which is why the timeout above is sized against the budget. A run that
      # overruns is a run whose entire night of tiles is thrown away, and at
      # z14 the North needs two nights: had the 180-minute timeout stayed, the
      # larger regions could have failed, discarded everything and retried for
      # ever without converging.
      #
      # Keyed by month as well as area, so a rebuild genuinely re-fetches
      # rather than repackaging stale imagery.
      - name: Restore the staged tiles
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache@v5
        with:
          path: staging
          # Keyed by the MONTH, not the run. Keyed by run id every run wrote a
          # fresh 70-240 MB entry, and a repository's cache is capped at 10 GB
          # with least-recently-used eviction — so a daily job would have
          # quietly evicted the lane refresh's council-data cache and turned
          # its 25-minute fetch back on. Within a month a retry resumes; a new
          # month re-fetches, which is the point of a rebuild.
          key: sat-${{ steps.plan.outputs.id }}-${{ steps.plan.outputs.month }}
          restore-keys: sat-${{ steps.plan.outputs.id }}-${{ steps.plan.outputs.month }}

      - name: Fetch and package
        if: steps.plan.outputs.work == 'true'
        run: |
          PLAN='${{ steps.plan.outputs.plan }}'
          BBOX=$(echo "$PLAN" | python -c 'import json,sys;print(" ".join(str(v) for v in json.load(sys.stdin)["bbox"]))')
          LABEL=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin)["label"])')
          MAXZ=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin)["max_zoom"])')

          mkdir -p dist/satellite
          # Sized to the LARGEST AREA, not to the timeout: the North is 53,778
          # tiles at z14, so 55,000 puts every region back inside a single run
          # the way splitting by area intended. It was 40,000, which fitted
          # when z13 made the North 13,682 and would now have split it over two
          # nights.
          #
          # This does not make the fetch ruder. The rate is the same three
          # connections with backoff; the run simply lasts longer, and a
          # 55,000-tile run is about four hours against the 350-minute ceiling
          # above. Fewer, longer runs move the same bytes in fewer days.
          python tools/build_satellite.py \
            --bbox $BBOX \
            --id "${{ steps.plan.outputs.id }}" \
            --label "$LABEL" \
            --max-zoom "$MAXZ" \
            --sharpen \
            --staging "staging/${{ steps.plan.outputs.id }}" \
            --budget 55000 \
            --package \
            --out "dist/satellite/${{ steps.plan.outputs.id }}.pmtiles" \
            --entry-out dist/satellite/entry.json

      # The one check worth having: the app's own reader must be able to open
      # it. A pack that packages cleanly and will not open is a pack every
      # rider downloads hundreds of megabytes of and cannot use.
      - name: Would the app be able to read it?
        if: steps.plan.outputs.work == 'true'
        run: |
          python - <<'PY'
          import glob, struct, sys

          # EVERY pack the run wrote. One fetch now publishes a pack per detail
          # tier, and a check against a fixed filename would have verified one
          # of them and shipped the other unread.
          paths = sorted(glob.glob("dist/satellite/*.pmtiles"))
          if not paths:
              sys.exit("no packs were written")

          for path in paths:
              with open(path, "rb") as f:
                  head = f.read(127)

              if head[:7] != b"PMTiles":
                  sys.exit("%s: not a PMTiles archive" % path)
              if head[7] != 3:
                  sys.exit("%s: spec version %d, the app reads 3"
                           % (path, head[7]))
              # The reader refuses an unclustered archive outright. Nothing in
              # the format documentation makes that obvious, and it is exactly
              # the sort of thing that would ship.
              if head[96] != 1:
                  sys.exit("%s: not clustered; the app will refuse it" % path)
              if head[99] != 3:
                  sys.exit("%s: tiles are not JPEG (type %d)"
                           % (path, head[99]))
              entries = struct.unpack_from("<Q", head, 80)[0]
              if entries < 100:
                  sys.exit("%s: only %d tiles; something went wrong"
                           % (path, entries))
              print("%s OK: %d tile entries, clustered, JPEG" % (path, entries))
          PY

      # Once a pack is written the staged tiles have done their job. Left in
      # place, the NEXT monthly rebuild would find every tile already there,
      # fetch nothing, and republish byte-identical imagery — so the refresh
      # would run for ever and the pictures would never actually change. That
      # is a correctness fault wearing the clothes of untidiness.
      - name: Clear the staged tiles
        if: steps.plan.outputs.work == 'true'
        run: |
          rm -rf "staging/${{ steps.plan.outputs.id }}"
          echo "staged tiles cleared; next rebuild re-fetches"

      - name: Publish
        if: steps.plan.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every pack this run wrote: one per detail tier.
          PACKS=$(ls dist/satellite/*.pmtiles)

          # One long-lived release holds every imagery pack. They are hundreds
          # of megabytes and cannot live beside the index on GitHub Pages,
          # which caps a site at 1 GB — the same reason the routing tiles are
          # addressed absolutely.
          gh release view satellite >/dev/null 2>&1 || \
            gh release create satellite \
              --title "Satellite imagery" \
              --notes "Sentinel-2 cloudless by EOX IT Services GmbH (CC BY 4.0). Contains modified Copernicus Sentinel data. Rebuilt one area at a time; see the dated asset list." \
              --latest=false

          gh release upload satellite $PACKS --clobber

          # The BASE of the release download path. Each entry appends its OWN
          # filename, because a run now publishes one asset per detail tier and
          # a single whole URL would have pointed every entry at one of them —
          # so a rider choosing "High detail" would have downloaded the
          # standard pack, with nothing anywhere saying so.
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/satellite/"
          python tools/record_satellite.py \
            --entry dist/satellite/entry.json \
            --url "$URL" \
            --area "${{ steps.plan.outputs.area }}" \
            --index satellite/index.json

          # The catalogue is rebuilt so riders see imagery without waiting for
          # the monthly lane refresh.
          #
          # The lane refresh keeps it because IT passes --satellite too, and it
          # verifies afterwards that the packs survived. That was not always
          # true: this comment used to claim the refresh "reads
          # satellite/index.json" when its build_catalogue call had no such
          # flag, so the first monthly refresh would have deleted every imagery
          # pack from the catalogue and nothing would have said so.
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          export REPO_URL
          bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
          # Refuses to publish a catalogue that lost something already
          # published. The catalogue is rebuilt from scratch, so a job that
          # forgets an index DELETES what another job published - silently, in
          # a build that otherwise succeeds. It has happened three times.
          python tools/verify_catalogue.py dist/catalogue.json
          mv dist/catalogue.json catalogue.json

          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A satellite/index.json catalogue.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          SIZE=$(python -c "import glob,os;print('%.0f MB' % (sum(os.path.getsize(p) for p in glob.glob('dist/satellite/*.pmtiles'))/1048576))")
          git commit -m "Satellite: ${{ steps.plan.outputs.id }} (${SIZE})" \
                     -m "Sentinel-2 cloudless via EOX, CC BY 4.0."
          # RE-DO THE RECORD ON TOP OF WHATEVER LANDED, rather than merge it.
          #
          # These jobs run for over an hour against a checkout taken at the
          # start. Anything else committing to main meanwhile - another of
          # these workflows, or a person - makes the push a non-fast-forward,
          # and the job fails AFTER uploading its release assets: the bytes are
          # published, the index pointing at them is not, and the catalogue
          # never learns they exist.
          #
          # The first attempt at this rebased, which was worse than doing
          # nothing. `catalogue.json` is GENERATED and rebuilt whole by both
          # sides, so it does not merge - it conflicts, every time, by
          # construction. The rebase then stopped mid-way and the retry loop
          # ran `git pull` again into an unresolved conflict ("Pulling is not
          # possible because you have unmerged files") three times before
          # pushing from a detached HEAD. It turned a recoverable race into a
          # broken tree.
          #
          # A generated file has no merge: it has a recipe. So on a rejection,
          # take the newest main, run the recipe again on top of it, and try
          # once more. `dist/` is gitignored, so the entry file and the packed
          # archives survive the reset - nothing is re-fetched, only re-recorded.
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "push rejected; rebuilding the record on top of origin/main"
            git fetch origin main
            git reset --hard origin/main

            python tools/record_satellite.py \n              --entry dist/satellite/entry.json \n              --url "$URL" \n              --area "${{ steps.plan.outputs.area }}" \n              --index satellite/index.json
            bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
            python tools/verify_catalogue.py dist/catalogue.json
            mv dist/catalogue.json catalogue.json

            git add -A satellite/index.json catalogue.json
            if git diff --cached --quiet; then
              echo "somebody else recorded it; nothing left to do"
              exit 0
            fi
            git commit -m "Satellite: ${{ steps.plan.outputs.id }} (${SIZE})" \n                       -m "Sentinel-2 cloudless via EOX, CC BY 4.0."
            sleep $((attempt * 5))
          done

      # Anything we publish and no longer should. Nothing else removes
      # anything: an entry is replaced when it is rebuilt, but a withdrawn
      # area or a tile upstream stops publishing would be offered for ever,
      # frozen at whenever it was last built, with nothing saying so.
      #
      # It refuses to act on an empty catalogue, because a build that failed
      # looks exactly like one where everything was withdrawn and the second
      # reading deletes the lot.
      - name: Prune what is no longer published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/prune_published.py             --catalogue catalogue.json             --satellite satellite/index.json             --routing routing/index.json             --apply > /tmp/orphans.txt || exit 0

          while read -r release asset; do
            [ -n "$asset" ] || continue
            echo "deleting $asset from the $release release"
            gh release delete-asset "$release" "$asset" --yes || true
          done < /tmp/orphans.txt

          if [ -s /tmp/orphans.txt ]; then
            git add -A satellite/index.json routing/index.json
            git diff --cached --quiet || {
              git commit -m "Prune withdrawn packs"
              # No rebase here. Pruning is idempotent and runs every time,
              # so a rejected push costs nothing but a day - whereas rebasing
              # a generated catalogue conflicts by construction and leaves the
              # tree mid-rebase, which is how a recoverable race became a
              # broken one. Give up cleanly and let tomorrow's run do it.
              git push || echo "push rejected; the next run prunes again"
            }
          fi

      - name: Raise an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Satellite build failed on $(date -u +%Y-%m-%d)"
          BODY=$(cat <<EOF
          The imagery build did not complete, so **nothing was published**.
          Riders keep whatever imagery they already have — this is the safe
          outcome, not an outage.

          Area: \`${{ steps.plan.outputs.id }}\`
          Log: $RUN_URL

          Most likely causes, in order:

          - **EOX was slow or refusing.** The staged tiles are cached, so a
            re-run picks up where this stopped rather than starting again. If
            it keeps happening, we are asking too much of a free service —
            talk to them about the offline mosaic.
          - **The archive check objected.** Read what it said; a pack that
            will not open is worse than no pack.

          Re-run from the Actions tab. Close this once it has gone green.
          EOF
          )
          EXISTING=$(gh issue list --label satellite --state open \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create satellite --color 1D76DB \
              --description "Automated imagery build problems" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label satellite
          fi
