name: Build satellite imagery

# Daily, and it decides for itself whether there is anything to do.
#
# One AREA per run, and since the move to z14 an area may take more than one.
# Counted from the tool's own tile maths rather than remembered:
#
#              z0-13    z0-14
#   east-anglia  3,983   15,295     south-east   5,013   19,358
#   wales        6,767   26,675     midlands     6,859   26,854
#   south-west   8,580   34,124     north       13,682   53,778
#
# The budget is 55,000, sized to the North so every region still fits in one
# run - that is what splitting by area was for. Six areas, six runs, and at
# twice daily that is three days; after which the job idles until the oldest
# pack is 25 days old.
#
# Both tiers come out of one fetch: a z0-14 archive contains z0-13, so this
# publishes Standard and High detail without fetching anything twice. Together
# they are roughly 3.9 GB of release assets for Britain.
#
# Nothing here needs a human. It picks the area, fetches it, packages it,
# publishes it, records it and stops. A run that finds nothing due exits in
# seconds having spent no bandwidth.
on:
  schedule:
    # Twice daily while Britain is being brought up to two tiers from nothing:
    # six areas at one run each is three days rather than six. Put back to a
    # single nightly run once the first full pass has landed - past that the
    # job is only refreshing packs older than 25 days and has no reason to ask
    # a free service for more than one area a night.
    - cron: '41 2 * * *'    # 02:41 UTC, off the hour to be a good citizen
    - cron: '41 14 * * *'   # and again mid-afternoon UTC
  workflow_dispatch:
    inputs:
      area:
        description: 'Force a particular area id (blank = whatever is due)'
        type: string
        default: ''
      max_zoom:
        description: 'Maximum zoom. 13 is Sentinel-2 native; 14 is 2x oversampled and publishes both tiers.'
        type: string
        default: '14'

permissions:
  contents: write   # to commit the record and upload the release asset
  issues: write     # to raise one when a run fails

concurrency:
  group: satellite
  cancel-in-progress: false   # never interrupt a run mid-publish

jobs:
  imagery:
    runs-on: ubuntu-latest
    # SIZED AGAINST THE BUDGET, not against an area. It was 180 minutes when
    # the largest area was 13,682 tiles at z13 and a run was "under an hour".
    # At z14 a full-budget run is 40,000 tiles — roughly three hours at the
    # same polite rate — so 180 was about to start timing out the nightly job
    # on the larger regions, on the first night this ran.
    #
    # 350 leaves real headroom under GitHub's own six-hour ceiling. The guard
    # it provides is still the one that matters: a hung request must not hold
    # a runner all day.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet Pillow

      # Cheap, and it guards a number nobody ever sees: the app picks the
      # coarsest tier for any rider who has not chosen one, by sorting on
      # `groundMetresPerPixel`. Written the wrong way round, every such rider
      # silently gets the largest file published instead of the smallest.
      - name: Check the imagery tiers
        run: python tools/test_build_satellite.py

      # Seconds, and nothing else runs it: it is hunt_*, not test_*, so the
      # lane refresh's glob leaves it alone (an imagery fault must not stop
      # lane data). It runs the two alarm steps at the bottom of this file
      # against a fake issue tracker: a cancelled or timed-out run must raise
      # one, and a withdrawn area's alarm must not stay open for ever.
      - name: Check the alarm wiring
        run: python tools/hunt_data_pipeline_satellite_alarm_lifecycle.py

      # Before anything is fetched or uploaded. Every pack up to 9 Oct 2026
      # came from EOX's 2024 layer, which is non-commercial, and was withdrawn
      # that day. An area with no imagery is due first, so without this a
      # SOURCE or LAYER moved off the allowlist (tools/imagery_withdrawn.py
      # ALLOWED_LAYERS) would be fetched and re-published. Fails the run, and
      # raises the alarm, rather than skipping in silence.
      # tools/test_imagery_withdrawn.py holds the order of these steps.
      - name: Is the imagery source one we may publish?
        run: python tools/imagery_withdrawn.py --source-check

      # Which area, if any. The plan is derived from the catalogue's own
      # areas, so adding a lane region adds an imagery region with no second
      # list to keep in step.
      - name: What is due?
        id: plan
        # Inputs reach the shell through env, quoted: never pasted into
        # the script, where a quote in one would run as code.
        env:
          AREA: ${{ inputs.area }}
          MAX_ZOOM: ${{ inputs.max_zoom || '14' }}
        run: |
          if [ -n "$AREA" ]; then
            # A forced run honours a refusal too: an area EOX refused is not
            # planned, so it is "not the one due" below.
            # --blocks-ref: main's latest blocks.json counts as well as this
            # checkout's, so a re-run or a run from a branch sees a stop
            # committed since; unreadable plans nothing.
            PLAN=$(python tools/satellite_plan.py --catalogue catalogue.json \
                     --refresh-after-days 0 \
                     --max-zoom "$MAX_ZOOM" \
                     --blocks satellite/blocks.json \
                     --blocks-ref origin/main)
            PLAN=$(python - "$PLAN" "$AREA" <<'PY'
          import json, sys
          plan = json.loads(sys.argv[1])
          # A forced run still goes through the planner, so the bounds and the
          # ids come from the same place as an automatic one.
          if plan.get("work") and not plan["id"].startswith(sys.argv[2]):
              plan = {"work": False, "why": "forced area %s is not the one due"
                                            % sys.argv[2]}
          print(json.dumps(plan))
          PY
          )
          else
            # THE DEFAULT MATTERS HERE. `inputs` exist only for a manual
            # dispatch, so on the nightly SCHEDULE this expanded to an empty
            # string and argparse rejected it:
            #
            #   satellite_plan.py: error: argument --max-zoom: invalid int
            #   value: ''
            #
            # Every scheduled run has died on that line nine seconds in and
            # raised an issue saying the build failed. Both packs published so
            # far were built by hand, and this workflow's own header promising
            # a full pass "in under a week" had never once been true.
            PLAN=$(python tools/satellite_plan.py --catalogue catalogue.json \
                     --max-zoom "$MAX_ZOOM" \
                     --blocks satellite/blocks.json \
                     --blocks-ref origin/main)
          fi
          echo "$PLAN"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "work=$(echo "$PLAN" | python -c 'import json,sys;print(str(json.load(sys.stdin).get("work",False)).lower())')" >> "$GITHUB_OUTPUT"
          echo "id=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')" >> "$GITHUB_OUTPUT"
          echo "area=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin).get("area",""))')" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.plan.outputs.work != 'true'
        run: echo "Everything is current. No bandwidth spent."

      # THE STAGED TILES ARE KEPT HOWEVER THE RUN ENDS.
      #
      # This used actions/cache, which declares `post-if: success()`: a run
      # that EOX stopped, that failed or that timed out saved nothing, and the
      # next run of that area asked EOX again for every tile it had already
      # sent - the heaviest possible answer to being told to back off. The
      # restore and the save are now separate steps, and "Save the staged
      # tiles" below runs on failure and cancellation too.
      #
      # ONE ENTRY PER WORKING RUN. A cache key is written once and never
      # replaced, so under the old single key per area and month the second
      # night's tiles were never saved at all. Each run that fetches now saves
      # under its own run id, and the restore takes the newest entry for this
      # area and month by prefix. Runs that find nothing due save nothing,
      # and a run that packaged its area cleared the tiles and saves nothing
      # either, so the entries are one or two per area per monthly rebuild,
      # well inside the repository's 10 GB (the lane refresh's council cache
      # shares it). GitHub drops an entry nobody has read for 7 days, so
      # after a 7-day refusal the area usually starts again from nothing;
      # that is expected, and at this pace re-fetching it is acceptable.
      #
      # Keyed by month as well as area, so a rebuild genuinely re-fetches
      # rather than repackaging stale imagery.
      - name: Restore the staged tiles
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: staging
          key: sat-${{ steps.plan.outputs.id }}-${{ steps.plan.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sat-${{ steps.plan.outputs.id }}-${{ steps.plan.outputs.month }}-

      - name: Fetch and package
        id: fetch
        if: steps.plan.outputs.work == 'true'
        run: |
          PLAN='${{ steps.plan.outputs.plan }}'
          BBOX=$(echo "$PLAN" | python -c 'import json,sys;print(" ".join(str(v) for v in json.load(sys.stdin)["bbox"]))')
          LABEL=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin)["label"])')
          MAXZ=$(echo "$PLAN" | python -c 'import json,sys;print(json.load(sys.stdin)["max_zoom"])')

          mkdir -p dist/satellite
          # Sized to the LARGEST AREA, not to the timeout: the North is 53,778
          # tiles at z14, so 55,000 puts every region back inside a single run
          # the way splitting by area intended. It was 40,000, which fitted
          # when z13 made the North 13,682 and would now have split it over two
          # nights.
          #
          # This does not make the fetch ruder. The rate is the same three
          # connections with backoff; the run simply lasts longer, and a
          # 55,000-tile run is about four hours against the 350-minute ceiling
          # above. Fewer, longer runs move the same bytes in fewer days.
          #
          # Exit 3 is EOX refusing us. The build has then written the refusal
          # to satellite/blocks.json, and `blocked` tells "Remember the
          # refusal" to commit it. The code is caught rather than left to
          # bash -e, which would end the step before anything said so; the
          # step still fails with the build's own code.
          rc=0
          python tools/build_satellite.py \
            --bbox $BBOX \
            --id "${{ steps.plan.outputs.id }}" \
            --label "$LABEL" \
            --max-zoom "$MAXZ" \
            --sharpen \
            --staging "staging/${{ steps.plan.outputs.id }}" \
            --budget 55000 \
            --package \
            --out "dist/satellite/${{ steps.plan.outputs.id }}.pmtiles" \
            --entry-out dist/satellite/entry.json \
            --state-out dist/satellite/state \
            --block-out satellite/blocks.json || rc=$?
          if [ "$rc" = 3 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
          # "incomplete": the area needs another run, so no pack yet.
          echo "state=$(cat dist/satellite/state 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # A REFUSAL IS REMEMBERED. Without this the next run, twelve hours on,
      # planned the same area and asked EOX again. The planner reads
      # satellite/blocks.json and leaves the area alone for at least 7 days,
      # or until EOX's Retry-After when that is longer.
      #
      # ON MAIN, WHEREVER THE RUN STARTED. Every scheduled run plans from
      # main, so that is where the record must land. A bare `git push` sent
      # it to the branch a manual run started from, where no scheduled run
      # reads it, and they would ask EOX again before the block ended. So
      # the record is merged into main's newest copy in a worktree of
      # origin/main (main's other records kept, the longer block winning),
      # committed there alone, and pushed to main, as the other data jobs
      # commit to main; nothing of the branch goes with it. A lost race
      # fetches main again and redoes the merge.
      # tools/hunt_data_pipeline_satellite_alarm_lifecycle.py holds this.
      - name: Remember the refusal
        id: remember
        if: always() && steps.fetch.outputs.blocked == 'true'
        env:
          AREA_ID: ${{ steps.plan.outputs.id }}
        run: |
          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          RECORD=$(mktemp)
          cp satellite/blocks.json "$RECORD"
          MAIN="$(mktemp -d)/main"
          trap 'git worktree remove --force "$MAIN" 2>/dev/null || true' EXIT
          DEPTH=
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then DEPTH=--depth=1; fi
          for attempt in 1 2 3; do
            git fetch --quiet $DEPTH origin +refs/heads/main:refs/remotes/origin/main
            git worktree remove --force "$MAIN" 2>/dev/null || true
            git worktree add --quiet --detach "$MAIN" refs/remotes/origin/main
            python -c 'import sys; sys.path.insert(0, "tools"); import satellite_plan as p; p.merge_block_files(*sys.argv[1:])' \
              "$MAIN/satellite/blocks.json" "$RECORD"
            git -C "$MAIN" add satellite/blocks.json
            if git -C "$MAIN" diff --cached --quiet; then
              echo "main already holds this refusal"
              echo "remembered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C "$MAIN" commit --quiet \
              -m "Satellite: EOX refused $AREA_ID; not asked again until its block ends" \
              -m "Recorded in satellite/blocks.json by tools/build_satellite.py."
            if git -C "$MAIN" push origin HEAD:refs/heads/main; then
              echo "remembered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected; merging the record into main's newest copy again"
            sleep $((attempt * 5))
          done
          echo "the refusal could not be recorded on main" >&2
          exit 1

      # The one check worth having: the app's own reader must be able to open
      # it. A pack that packages cleanly and will not open is a pack every
      # rider downloads hundreds of megabytes of and cannot use.
      # An area bigger than one run's budget is fetched over two runs, and
      # the first writes no pack. That is progress, not a failure; any other
      # state, a missing one included, goes on to the check below.
      - name: Not finished this run
        if: steps.plan.outputs.work == 'true' && steps.fetch.outputs.state == 'incomplete'
        run: echo "nothing to build this run - ${{ steps.plan.outputs.id }} is partly fetched; its tiles are saved and the rest are fetched next run."

      - name: Would the app be able to read it?
        if: steps.plan.outputs.work == 'true' && steps.fetch.outputs.state != 'incomplete'
        run: |
          python - <<'PY'
          import glob, struct, sys

          # EVERY pack the run wrote. One fetch now publishes a pack per detail
          # tier, and a check against a fixed filename would have verified one
          # of them and shipped the other unread.
          paths = sorted(glob.glob("dist/satellite/*.pmtiles"))
          if not paths:
              sys.exit("no packs were written")

          for path in paths:
              with open(path, "rb") as f:
                  head = f.read(127)

              if head[:7] != b"PMTiles":
                  sys.exit("%s: not a PMTiles archive" % path)
              if head[7] != 3:
                  sys.exit("%s: spec version %d, the app reads 3"
                           % (path, head[7]))
              # The reader refuses an unclustered archive outright. Nothing in
              # the format documentation makes that obvious, and it is exactly
              # the sort of thing that would ship.
              if head[96] != 1:
                  sys.exit("%s: not clustered; the app will refuse it" % path)
              if head[99] != 3:
                  sys.exit("%s: tiles are not JPEG (type %d)"
                           % (path, head[99]))
              entries = struct.unpack_from("<Q", head, 80)[0]
              if entries < 100:
                  sys.exit("%s: only %d tiles; something went wrong"
                           % (path, entries))
              print("%s OK: %d tile entries, clustered, JPEG" % (path, entries))
          PY

      # Once a pack is written the staged tiles have done their job. Left in
      # place, the NEXT monthly rebuild would find every tile already there,
      # fetch nothing, and republish byte-identical imagery — so the refresh
      # would run for ever and the pictures would never actually change. That
      # is a correctness fault wearing the clothes of untidiness.
      - name: Clear the staged tiles
        id: clear
        if: steps.plan.outputs.work == 'true' && steps.fetch.outputs.state != 'incomplete'
        run: |
          rm -rf "staging/${{ steps.plan.outputs.id }}"
          echo "staged tiles cleared; next rebuild re-fetches"

      # However the run ended - refused, failed, timed out - except once the
      # tiles were packaged and cleared, when there is nothing to keep.
      - name: Save the staged tiles
        if: always() && steps.plan.outputs.work == 'true' && steps.clear.outcome != 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: staging
          key: sat-${{ steps.plan.outputs.id }}-${{ steps.plan.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}

      # tools/imagery_withdrawn.py runs twice in here: nothing is uploaded
      # unless every new entry records an allowed layer and no withdrawn
      # asset, and nothing is committed (on either path) whose index or
      # rebuilt catalogue lists a withdrawn asset or a layer off the list.
      # The comments live out here because the retry hunt hands this run
      # body to `bash -c`, which on Windows drops anything past ~8 KB.
      - name: Publish
        id: publish
        if: steps.plan.outputs.work == 'true' && steps.fetch.outputs.state != 'incomplete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every pack this run wrote: one per detail tier.
          PACKS=$(ls dist/satellite/*.pmtiles)

          python tools/imagery_withdrawn.py --entry dist/satellite/entry.json

          # One long-lived release holds every imagery pack. They are hundreds
          # of megabytes and cannot live beside the index on GitHub Pages,
          # which caps a site at 1 GB — the same reason the routing tiles are
          # addressed absolutely.
          #
          # The notes are build_satellite.py's ATTRIBUTION word for word
          # (tools/test_imagery_licence.py checks), and are set again on every
          # run: the release was created under the 2024 mosaic, whose notes
          # wrongly said CC BY 4.0, and would otherwise keep them for ever.
          NOTES="EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2016 & 2017), CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Resampled and sharpened by Trail Blazer. Rebuilt one area at a time; see the dated asset list."
          gh release view satellite >/dev/null 2>&1 || \
            gh release create satellite \
              --title "Satellite imagery" \
              --notes "$NOTES" \
              --latest=false
          gh release edit satellite --notes "$NOTES"

          # From here until `recorded`, the served packs are new (or, if the
          # upload dies part-way, deleted by --clobber or only some replaced)
          # and the index still holds the old sha256: every download of this
          # area fails. The alarm reads these two to say so instead of claiming
          # nothing was published, and the stand-down reads `recorded` so that
          # only a run that really recorded this area can close its alarm.
          # Written BEFORE the upload: one that fails half-way through has
          # already changed what riders are served.
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          gh release upload satellite $PACKS --clobber

          # The BASE of the release download path. Each entry appends its OWN
          # filename, because a run now publishes one asset per detail tier and
          # a single whole URL would have pointed every entry at one of them —
          # so a rider choosing "High detail" would have downloaded the
          # standard pack, with nothing anywhere saying so.
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/satellite/"
          python tools/record_satellite.py \
            --entry dist/satellite/entry.json \
            --url "$URL" \
            --area "${{ steps.plan.outputs.area }}" \
            --index satellite/index.json

          # The catalogue is rebuilt so riders see imagery without waiting for
          # the monthly lane refresh.
          #
          # The lane refresh keeps it because IT passes --satellite too, and it
          # verifies afterwards that the packs survived. That was not always
          # true: this comment used to claim the refresh "reads
          # satellite/index.json" when its build_catalogue call had no such
          # flag, so the first monthly refresh would have deleted every imagery
          # pack from the catalogue and nothing would have said so.
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          export REPO_URL
          bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
          # Refuses to publish a catalogue that lost something already
          # published. The catalogue is rebuilt from scratch, so a job that
          # forgets an index DELETES what another job published - silently, in
          # a build that otherwise succeeds. It has happened three times.
          python tools/verify_catalogue.py dist/catalogue.json
          python tools/imagery_withdrawn.py --index satellite/index.json --catalogue dist/catalogue.json
          mv dist/catalogue.json catalogue.json

          git config user.name  'Trail Blazer data bot'
          git config user.email 'noreply@github.com'
          git add -A satellite/index.json catalogue.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIZE=$(python -c "import glob,os;print('%.0f MB' % (sum(os.path.getsize(p) for p in glob.glob('dist/satellite/*.pmtiles'))/1048576))")
          git commit -m "Satellite: ${{ steps.plan.outputs.id }} (${SIZE})" \
                     -m "EOxCloudless 2016 by EOX IT Services GmbH, CC BY 4.0."
          # RE-DO THE RECORD ON TOP OF WHATEVER LANDED, rather than merge it.
          #
          # These jobs run for over an hour against a checkout taken at the
          # start. Anything else committing to main meanwhile - another of
          # these workflows, or a person - makes the push a non-fast-forward,
          # and the job fails AFTER uploading its release assets: the bytes are
          # published, the index pointing at them is not, and the catalogue
          # never learns they exist.
          #
          # The first attempt at this rebased, which was worse than doing
          # nothing. `catalogue.json` is GENERATED and rebuilt whole by both
          # sides, so it does not merge - it conflicts, every time, by
          # construction. The rebase then stopped mid-way and the retry loop
          # ran `git pull` again into an unresolved conflict ("Pulling is not
          # possible because you have unmerged files") three times before
          # pushing from a detached HEAD. It turned a recoverable race into a
          # broken tree.
          #
          # A generated file has no merge: it has a recipe. So on a rejection,
          # take the newest main, run the recipe again on top of it, and try
          # once more. `dist/` is gitignored, so the entry file and the packed
          # archives survive the reset - nothing is re-fetched, only re-recorded.
          for attempt in 1 2 3; do
            if git push; then
              echo "recorded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected; rebuilding the record on top of origin/main"
            git fetch origin main
            git reset --hard origin/main

            # REAL LINE CONTINUATIONS. These two commands once carried a
            # two-character `\n` where each backslash-newline belonged, so bash
            # handed record_satellite.py a stray `n` per line, argparse exited
            # 2, and the step died inside the one retry that exists for a lost
            # race - after the upload above had already replaced the area's
            # packs. The served bytes were new and the recorded sha256 old, so
            # every rider's download of that area failed its checksum.
            # tools/hunt_data_pipeline_satellite_retry.py tokenises both copies
            # the way bash does and refuses any difference from the first.
            python tools/record_satellite.py \
              --entry dist/satellite/entry.json \
              --url "$URL" \
              --area "${{ steps.plan.outputs.area }}" \
              --index satellite/index.json
            bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
            python tools/verify_catalogue.py dist/catalogue.json
            python tools/imagery_withdrawn.py --index satellite/index.json --catalogue dist/catalogue.json
            mv dist/catalogue.json catalogue.json

            git add -A satellite/index.json catalogue.json
            if git diff --cached --quiet; then
              echo "somebody else recorded it; nothing left to do"
              echo "recorded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Satellite: ${{ steps.plan.outputs.id }} (${SIZE})" \
                       -m "EOxCloudless 2016 by EOX IT Services GmbH, CC BY 4.0."
            sleep $((attempt * 5))
          done
          # THE LAST RE-RECORD IS PUSHED TOO, OR THE STEP FAILS. The loop used
          # to end on a commit it never pushed, so three lost races in a row
          # finished the step green with the packs replaced and nothing
          # recorded. Under bash -e a rejection here fails the step, and the
          # alarm below says the packs are out of step with their checksums.
          git push
          echo "recorded=true" >> "$GITHUB_OUTPUT"

      # Anything we publish and no longer should. Nothing else removes
      # anything: an entry is replaced when it is rebuilt, but a withdrawn
      # area or a tile upstream stops publishing would be offered for ever,
      # frozen at whenever it was last built, with nothing saying so.
      #
      # It refuses to act on an empty catalogue, because a build that failed
      # looks exactly like one where everything was withdrawn and the second
      # reading deletes the lot.
      - name: Prune what is no longer published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/prune_published.py \
            --catalogue catalogue.json \
            --satellite satellite/index.json \
            --routing routing/index.json \
            --apply > /tmp/orphans.txt || exit 0

          while read -r release asset; do
            [ -n "$asset" ] || continue
            echo "deleting $asset from the $release release"
            gh release delete-asset "$release" "$asset" --yes || true
          done < /tmp/orphans.txt

          if [ -s /tmp/orphans.txt ]; then
            git add -A satellite/index.json routing/index.json
            git diff --cached --quiet || {
              git commit -m "Prune withdrawn packs"
              # No rebase here. Pruning is idempotent and runs every time,
              # so a rejected push costs nothing but a day - whereas rebasing
              # a generated catalogue conflicts by construction and leaves the
              # tree mid-rebase, which is how a recoverable race became a
              # broken one. Give up cleanly and let tomorrow's run do it.
              git push || echo "push rejected; the next run prunes again"
            }
          fi

      # ONE ALARM PER AREA, and only that area's own success closes it.
      #
      # There used to be one alarm for the whole job: a failure commented on
      # whichever satellite issue was open, and ANY green run closed them all.
      # So when Wales died after replacing its packs, the next green run of
      # the North said "Fixed" while every Wales download still failed its
      # checksum. The alarm now carries the area it is about (`Area:` below,
      # "none" when the run stopped before choosing one), and is matched on
      # that line both ways.
      #
      # AND IT RINGS ON A CANCELLED RUN, which includes a TIMED-OUT one. This
      # was `if: failure()`, and a job that reaches timeout-minutes above is
      # cancelled, not failed - as is one stopped by hand - so `failure()` was
      # false and nothing was raised. A run that times out inside Publish's
      # upload is the worst case there is (packs replaced, checksums old) and
      # it said nothing at all. `cancelled()` costs one issue when somebody
      # stops a run on purpose, which they can close.
      # tools/hunt_data_pipeline_satellite_alarm_lifecycle.py holds this.
      - name: Raise an issue if this run failed
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AREA_ID: ${{ steps.plan.outputs.id }}
          UPLOADED: ${{ steps.publish.outputs.uploaded }}
          RECORDED: ${{ steps.publish.outputs.recorded }}
          BLOCKED: ${{ steps.fetch.outputs.blocked }}
          REMEMBERED: ${{ steps.remember.outputs.remembered }}
          JOB_STATUS: ${{ job.status }}
        run: |
          KEY="${AREA_ID:-none}"
          if [ "$JOB_STATUS" = "cancelled" ]; then
            ENDED="was cancelled - by hand, or by the 350-minute timeout -"
            HEADLINE="was cancelled or timed out"
            AGAIN="Cancelled or timed out"
          else
            ENDED="failed"
            HEADLINE="failed"
            AGAIN="Failed again"
          fi
          alarms_for() {
            gh issue list --label satellite --state open --limit 200 \
              --json number,body | python -c '
          import json, sys
          key = sys.argv[1]
          for issue in json.load(sys.stdin):
              body = issue.get("body") or ""
              if ("Area: `%s`" % key) in body or (key == "none" and "Area: ``" in body):
                  print(issue["number"])
          ' "$1"
          }

          if [ "$UPLOADED" = "true" ] && [ "$RECORDED" != "true" ]; then
            TITLE="Satellite imagery for $KEY does not match its checksums"
            OUTCOME=$(cat <<EOF
          **Riders cannot download this area's imagery.** The new packs were
          uploaded over the served ones (or the upload died part-way, after
          --clobber had removed some), but satellite/index.json and
          catalogue.json still carry the old sha256, so every download of
          \`$KEY\` fails until the area is recorded.

          Run this workflow from the Actions tab with area \`$KEY\` as soon as
          you can. Only a run that rebuilds and records this area closes this.
          EOF
          )
          elif [ "$BLOCKED" = "true" ]; then
            # What EOX said and when any area comes due again, from the
            # record the build wrote under this area's host.
            SAID=$(python -c '
          import json, sys
          try:
              with open("satellite/blocks.json", encoding="utf-8") as f:
                  hosts = json.load(f)["hosts"]
              host, rec = next((h, r) for h, r in hosts.items()
                               if r.get("area") == sys.argv[1])
              status = rec.get("status")
              what = ("connection failures" if status == "network"
                      else "HTTP %s" % status)
              if rec.get("retry_after") is not None:
                  what += ", Retry-After %s s" % rec["retry_after"]
              print("%s|%s|%s" % (what, host,
                                  rec.get("until") or "an unknown date"))
          except (OSError, ValueError, KeyError, TypeError, AttributeError,
                  StopIteration):
              print("a refusal not on record|the tile host|an unknown date")
          ' "$KEY")
            WHAT="${SAID%%|*}"
            REST="${SAID#*|}"
            HOST="${REST%%|*}"
            UNTIL="${REST#*|}"
            TITLE="Satellite build for $KEY stopped: EOX refused us"
            if [ "$REMEMBERED" = "true" ]; then
              NEXT="Nothing retries around a refusal: every area comes from $HOST, so the planner asks it for no area at all until **$UNTIL** (7 days, or longer when EOX's Retry-After asks for longer), as recorded in satellite/blocks.json."
            else
              NEXT="**The refusal could not be recorded** in satellite/blocks.json, so the planner may ask $HOST for an area again on the next run. Disable this workflow from the Actions tab until someone has looked into EOX's refusal."
            fi
            OUTCOME=$(cat <<EOF
          EOX ($HOST) refused us ($WHAT) in \`$KEY\`, so the build stopped
          and **nothing was published**. Riders keep the imagery they have.

          $NEXT

          The tiles fetched before the stop were saved to the cache, so a
          later run resumes rather than fetching them again.
          EOF
          )
          else
            TITLE="Satellite build $HEADLINE for $KEY on $(date -u +%Y-%m-%d)"
            OUTCOME=$(cat <<EOF
          The imagery build $ENDED before it finished, so **nothing was
          published**.
          Riders keep whatever imagery they already have — this is the safe
          outcome, not an outage.
          EOF
          )
          fi
          BODY=$(cat <<EOF
          $OUTCOME

          Area: \`$KEY\`
          Log: $RUN_URL

          Most likely causes, in order:

          - **EOX was slow or refusing.** If it keeps happening, we are
            asking too much of a free service — talk to them about the
            offline mosaic.
          - **It ran out of time** (cancelled at 350 minutes). The staged
            tiles are saved however a run ends, so a re-run resumes where
            this one stopped; one that keeps timing out needs a smaller
            budget, not another try.
          - **The archive check objected.** Read what it said; a pack that
            will not open is worse than no pack.
          - **The push lost a race three times.** Another job kept committing
            to main while this one re-recorded on top of it.

          Re-run from the Actions tab. This closes itself once this area has
          gone green.
          EOF
          )
          EXISTING=$(alarms_for "$KEY" 2>/dev/null | head -n 1 || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$AGAIN: $RUN_URL

          $OUTCOME"
          else
            gh label create satellite --color 1D76DB \
              --description "Automated imagery build problems" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label satellite
          fi

      # AND STAND IT DOWN AGAIN - THE RIGHT ONE.
      #
      # Nothing closed these. Two of the three issues open on 16 September were
      # for faults that had already fixed themselves - satellite had succeeded
      # several times since its issue was raised - and an alarm that never
      # resets is one people learn to scroll past, which is the failure the
      # alarm exists to prevent.
      #
      # But closing EVERY satellite alarm on any green run was the opposite
      # fault: a run that rebuilt the North, or found nothing due, closed the
      # alarm for a Wales whose served packs no longer matched their recorded
      # checksums. So an area's alarm closes only when this run RECORDED that
      # area (Publish's `recorded`), and the "none" alarms - a failure before
      # any area was chosen, or in pruning - close on any green run, because
      # every green run has planned and pruned.
      #
      # AN AREA NO RUN WILL EVER RECORD AGAIN. Closing only on "this run
      # recorded that area" left an alarm open for ever once its area could
      # not be recorded: the planner picks only areas the catalogue lists
      # WITH LANES (tools/satellite_plan.py areas_with_lanes, asked directly
      # below so there is no second definition to drift), and a forced run
      # still goes through it. So, on every green run:
      #
      #   - an area the catalogue no longer lists at all is WITHDRAWN. No
      #     rider is offered it and pruning removes its packs, so its alarm
      #     is closed, saying so.
      #   - an area still listed but no longer planned (it lost its lanes or
      #     its bounds) still has its packs SERVED, possibly the mismatched
      #     ones the alarm is about. That stays open - closing it would hide
      #     an outage - and gets ONE comment saying no run will close it, so
      #     it is not a twice-daily comment either.
      #
      # It does nothing on a catalogue it cannot read or that plans no area,
      # for the reason pruning refuses one: a broken build looks exactly like
      # "everything was withdrawn", and that reading would close every alarm.
      # tools/hunt_data_pipeline_satellite_alarm_lifecycle.py holds all three.
      - name: Stand the alarm down if this worked
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AREA_ID: ${{ steps.plan.outputs.id }}
          RECORDED: ${{ steps.publish.outputs.recorded }}
        run: |
          alarms_for() {
            gh issue list --label satellite --state open --limit 200 \
              --json number,body | python -c '
          import json, sys
          key = sys.argv[1]
          for issue in json.load(sys.stdin):
              body = issue.get("body") or ""
              if ("Area: `%s`" % key) in body or (key == "none" and "Area: ``" in body):
                  print(issue["number"])
          ' "$1"
          }

          KEYS="none"
          if [ "$RECORDED" = "true" ] && [ -n "$AREA_ID" ]; then
            KEYS="none $AREA_ID"
          fi
          for key in $KEYS; do
            for n in $(alarms_for "$key" 2>/dev/null || true); do
              gh issue close "$n" \
                --comment "Fixed: $RUN_URL succeeded for \`$key\`." || true
            done
          done

          NOTE="No run will close this on its own"
          unrecordable() {
            gh issue list --label satellite --state open --limit 200 \
              --json number,body,comments | python -c '
          import json, re, sys
          sys.path.insert(0, "tools")
          from satellite_plan import areas_with_lanes
          note = sys.argv[2]
          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  catalogue = json.load(f)
              alarms = json.load(sys.stdin)
          except (OSError, ValueError) as e:
              sys.exit("leaving every area alarm alone: %s" % e)
          listed = {a.get("id") for c in catalogue.get("continents", [])
                    for k in c.get("countries", []) for a in k.get("areas", [])}
          planned = {a["id"] for a in areas_with_lanes(catalogue)}
          if not listed or not planned:
              sys.exit("the catalogue plans no area; leaving every area alarm alone")
          for issue in alarms:
              m = re.search(r"Area: `([^`]+)`", issue.get("body") or "")
              if not m:
                  continue
              key = m.group(1)
              if key in planned or not key.endswith("-satellite"):
                  continue
              area = key[:-len("-satellite")]
              if area not in listed:
                  print("withdrawn", issue["number"], key, area)
                  continue
              said = [(c.get("body") or "") if isinstance(c, dict) else str(c)
                      for c in issue.get("comments") or []]
              if not any(note in s for s in said):
                  print("unplanned", issue["number"], key, area)
          ' catalogue.json "$NOTE"
          }
          while read -r verb n key area; do
            case "$verb" in
              withdrawn)
                gh issue close "$n" --comment "Withdrawn: \`$area\` is no longer in the catalogue, so no rider is offered its imagery and pruning removes its packs. No run will record \`$key\` again, so nothing is left for this alarm to watch. ($RUN_URL)" || true
                ;;
              unplanned)
                gh issue comment "$n" --body "$NOTE: \`$area\` is still in the catalogue but no longer publishes lanes (or has lost its bounds), so the planner never picks \`$key\` and no run - scheduled or forced from the Actions tab - will record it. Its imagery packs are still published as they are. Give it lanes again, or withdraw the area so pruning removes its packs; this closes itself once either happens. ($RUN_URL)" || true
                ;;
            esac
          done < <(unrecordable || true)
