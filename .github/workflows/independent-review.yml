name: independent-review

# THE SECOND HALF OF THE INDEPENDENT REVIEW GATE. pr-capture.yml, running in
# the pull request's context with no secrets, uploads the diff as the
# artifact `review-input`. This workflow is triggered when that finishes. A
# `workflow_run` workflow always runs as main has it, never as the pull
# request has it, so the pull request cannot rewrite its own reviewer.
#
# It never checks out or runs the pull request. It checks out main (for the
# reviewer prompts, the locked CLI and tools/review_*.py), reads the capture
# as DATA, and hands it to Claude Code with every tool removed, so the
# reviewer can read and answer and do nothing else.
#
#   GATE tier      (the gate's own files)  never a model: owner must review
#   SECURITY tier  claude-opus-5-5 AND claude-sonnet-5-5, both must pass
#   CODE tier      claude-opus-5-5 AND claude-sonnet-5-5, both must pass
#   DATA tier      tools/review_data_check.py AND claude-sonnet-5-5
#   (tools/review_tier.py decides, from GitHub's own list of changed
#   files; every .py is SECURITY)
#
# WHO MAY SAY "PASS". The check run and the commit status, both called
# `independent-review`, are posted with a token for the dedicated review
# GitHub App, minted from secrets that live in the `review` Environment,
# which only main may deploy to. This workflow's own GITHUB_TOKEN cannot
# write statuses, checks or comments at all. The ruleset requires the check
# FROM THAT APP, so a workflow on a pull request's branch, which can post
# any status it likes with its own token, posts one that does not count.
# Setup: docs/REVIEW-GATE-SETUP.md.
#
# IT FAILS CLOSED, and without spending a model call, when: the pull request
# comes from a fork; touches the gate itself; is a re-run; disagrees with
# GitHub's own record; is over 400 KB; holds binary content, a symlink, a
# submodule or a mode change; is a change (by `git patch-id`) that has
# already failed review, or is under review in another run; comes from a
# pull request or branch that has already failed twice in 7 days; or
# arrives while review is paused (4 failures in 24 hours repo-wide, or a
# 3-day streak of that until the owner resets). The ledger is a separate
# public repository (tools/review_ledger.py). A claim counts as a failure
# until a PASS settles it, so cancelling a run cannot erase a FAIL, and no
# model output reaches this public log before the ledger is settled. No
# verdict, or an unreadable one, is a FAIL.
# A missing CLAUDE_CODE_OAUTH_TOKEN posts `error`, "reviewer not
# configured". Nothing here ever posts success except a PASS read by
# tools/review_verdict.py on a change the ledger has never seen fail.
#
# SECRETS: the OAuth token reaches only the reviewer step, which starts the
# CLI under `env -i` with the token and nothing else of note. No GitHub
# token of any kind is given to that step.

on:
  workflow_run:
    workflows: [pr-capture]
    types: [completed]

permissions:
  actions: read    # the capture artifact from the triggering run
  contents: read   # main's prompts and tools

# ONE REVIEW AT A TIME, ACROSS THE WHOLE REPOSITORY, in order: each run
# settles the ledger before the next one reads it, so no two runs can
# both pass the same change, or both count as "the first failure".
concurrency:
  group: independent-review
  queue: max
  cancel-in-progress: false

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment: review
    timeout-minutes: 50

    env:
      # All from the workflow_run event GitHub wrote, not from the capture.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      CAPTURE_PATH: ${{ github.event.workflow_run.path }}
      CAPTURE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      CAPTURE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLI_VERSION: '2.1.286'

    steps:
      # Main only. Sparse and blob-less: the prompts, the locked CLI and the
      # tools are all this needs; pull request files are read as git
      # objects, fetched on demand, never checked out.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/review
            tools

      - name: Is the gate configured?
        id: configured
        env:
          HAS_APP: ${{ secrets.REVIEW_APP_ID != '' && secrets.REVIEW_APP_KEY != '' }}
          HAS_LEDGER: ${{ secrets.LEDGER_APP_ID != '' && secrets.LEDGER_APP_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "oauth=$HAS_OAUTH" >> "$GITHUB_OUTPUT"
          echo "ledger=$HAS_LEDGER" >> "$GITHUB_OUTPUT"
          if [ "$HAS_APP" != "true" ]; then
            echo "::error::REVIEW_APP_ID / REVIEW_APP_KEY are not in the 'review' environment, so no status can be posted and nothing can merge. See docs/REVIEW-GATE-SETUP.md."
            exit 1
          fi

      # This repository: the check run, the status, the comment, and reads.
      # Never contents write.
      - name: Mint the review app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_KEY }}
          permission-checks: write
          permission-statuses: write
          permission-pull-requests: write
          permission-contents: read

      # The ledger repository, and nothing else: a second app, installed on
      # that private repository alone, so this token cannot reach this one.
      - name: Mint the ledger token
        id: ledger-app
        if: steps.configured.outputs.ledger == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.LEDGER_APP_ID }}
          private-key: ${{ secrets.LEDGER_APP_KEY }}
          owner: LPSD-1
          repositories: trailblazer-review-ledger
          permission-contents: write

      - name: Mark the review as running
        id: pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha"; exit 1; }
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=pending \
            -f context=independent-review -f description="Review running" \
            -f target_url="$RUN_URL" > /dev/null
          check_id=$(gh api -X POST "repos/$REPO/check-runs" \
            -f name=independent-review -f head_sha="$HEAD_SHA" \
            -f status=in_progress -f details_url="$RUN_URL" --jq .id)
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      - name: Fetch the capture
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the capture against GitHub and choose the tier
        id: inputs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LEDGER_TOKEN: ${{ steps.ledger-app.outputs.token }}
          LEDGER_REPO: LPSD-1/trailblazer-review-ledger
          OAUTH: ${{ steps.configured.outputs.oauth }}
        run: |
          set -uo pipefail
          in="$RUNNER_TEMP/review-input"
          rt="$RUNNER_TEMP/review"
          mkdir -p "$rt/verdicts"
          fail() {
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 0
          }

          # The pull request, found from the commit GitHub says was
          # captured: by its head branch first, then by the commit.
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main \
                 -f head="$HEAD_OWNER:$HEAD_BRANCH" -f per_page=100 \
                 --jq "[.[] | select(.head.sha == \"$HEAD_SHA\") | .number]
                       | if length == 1 then .[0] else empty end") || pr=""
          if [ -z "$pr" ]; then
            pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                   --jq "[.[] | select(.state == \"open\" and .base.ref == \"main\"
                                  and .head.sha == \"$HEAD_SHA\") | .number]
                         | if length == 1 then .[0] else empty end") || pr=""
          fi
          [[ "$pr" =~ ^[0-9]+$ ]] || fail "No single open pull request to main has this head commit"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

          # A fork's pull request is the owner's to read: its author is not
          # one of ours, and its branch is not ours to fetch from.
          if [ "${HEAD_REPO,,}" != "${REPO,,}" ]; then
            fail "owner must review (fork)"
          fi

          # NO RE-RUNS. A model's verdict is not deterministic; re-running
          # until it passes would make the review a lottery.
          if [ "$RUN_ATTEMPT" != "1" ] || [ "$CAPTURE_ATTEMPT" != "1" ]; then
            fail "Re-runs are refused: push a change instead"
          fi

          [ "${CAPTURE_PATH%%@*}" = ".github/workflows/pr-capture.yml" ] \
            || fail "Not started by .github/workflows/pr-capture.yml"
          [ "$CAPTURE_CONCLUSION" = "success" ] || fail "pr-capture did not succeed"
          for f in diff.patch files.txt meta.json; do
            [ -f "$in/$f" ] || fail "The capture has no $f"
          done
          [ "$(jq -r .head_sha "$in/meta.json")" = "$HEAD_SHA" ] \
            && [ "$(jq -r .number "$in/meta.json")" = "$pr" ] \
            || fail "The capture describes a different commit or pull request"

          # The changed files as GITHUB lists them, both sides of a rename.
          # The tier is decided from this list, never from the capture's.
          count=$(gh api "repos/$REPO/pulls/$pr" --jq .changed_files) \
            || fail "Could not read the pull request"
          [ "$count" -lt 3000 ] || fail "3000 or more files: too large for the automatic review"
          gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | LC_ALL=C sort -u > "$rt/files.txt" \
            || fail "Could not list the changed files"
          gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | LC_ALL=C sort -u > "$rt/present.txt" \
            || fail "Could not list the changed files"
          grep -v '^$' "$in/files.txt" | LC_ALL=C sort -u > "$rt/captured.txt"
          cmp -s "$rt/files.txt" "$rt/captured.txt" \
            || fail "The capture's file list does not match GitHub's"

          # THE GATE ITSELF is never reviewed by a model: a change here could
          # rewrite its own review, and pr-capture.yml runs as the pull
          # request has it, so its capture of itself proves nothing.
          tier=$(python3 tools/review_tier.py "$rt/files.txt") \
            || fail "Could not decide the review tier"
          [ "$tier" != "gate" ] || fail "owner must review the review gate"
          case "$tier" in security|code|data) ;; *) fail "Unknown tier $tier" ;; esac

          [ "$(jq -r .truncated "$in/meta.json")" = "false" ] \
            || fail "The diff is over 400 KB: too large for the automatic review"

          # What a text diff cannot show, no reviewer can judge.
          python3 tools/review_data_check.py --structure --diff "$in/diff.patch" \
            || fail "owner must review: binary content, a symlink, a submodule or a mode change"

          # The head commit's objects, for the data check. Fetched, never
          # checked out; blobs arrive on demand.
          git fetch --no-tags --depth=1 --filter=blob:none origin "$HEAD_SHA" \
            && git cat-file -e "$HEAD_SHA^{commit}" \
            || fail "Could not fetch the head commit"

          # THE LEDGER: a change that failed once never passes later, however
          # it is re-pushed; an identical change already under review is
          # refused; a pull request or branch that has failed twice in 7
          # days is the owner's; and review pauses repo-wide after 4
          # failures in 24 hours. Then the change is CLAIMED, and the claim
          # counts as a failure until a PASS settles it, before any model
          # is asked. Missing or unreadable: fail closed. (Without an OAuth
          # token there is no review to claim: the status is `error`.)
          pid=$(python3 tools/review_ledger.py patch-id "$in/diff.patch") \
            || fail "The diff has no patch-id"
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          if [ "$OAUTH" = "true" ]; then
            python3 tools/review_ledger.py claim --pid "$pid" --pr "$pr" \
              --branch "$HEAD_BRANCH" > "$rt/ledger.txt"
            case $? in
              0) echo "claimed=true" >> "$GITHUB_OUTPUT" ;;
              3) fail "This exact change already failed review (patch-id $pid)" ;;
              4) fail "An identical change is under review now (patch-id $pid)" ;;
              5) fail "owner must review (repeated failures)" ;;
              6) fail "review paused: too many failures today" ;;
              7) fail "review paused until the owner resets the ledger" ;;
              *) fail "The review ledger cannot be read or written: see docs/REVIEW-GATE-SETUP.md" ;;
            esac
          fi

          echo "Tier: $tier ($count files), patch-id $pid"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # DATA tier: the deterministic check first. It reads the pull
      # request's files as git objects; nothing is checked out or run.
      - name: Data check
        if: steps.inputs.outputs.ok == 'true' && steps.inputs.outputs.tier == 'data'
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/review/verdicts/data-check.txt"
          python3 tools/review_data_check.py --diff "$RUNNER_TEMP/review-input/diff.patch" \
            --files "$RUNNER_TEMP/review/present.txt" --rev "$HEAD_SHA" > "$out" \
            || printf '\nThe data check crashed.\n\nVERDICT: FAIL\n' >> "$out"
          cat "$out"

      # The CLI from a committed lockfile: every package checked against its
      # sha512 before it is unpacked. No cache anyone else could write.
      - name: Install the Claude Code CLI
        if: steps.inputs.outputs.ok == 'true' && steps.configured.outputs.oauth == 'true'
        run: |
          set -euo pipefail
          cd .github/review/cli
          npm ci --no-audit --no-fund --loglevel=error
          ./node_modules/.bin/claude --version | grep -qF "$CLI_VERSION"

      # THE REVIEWER. Zero tools:
      #   --tools ""            removes every built-in tool;
      #   --disallowedTools "*" denies every tool by name, MCP included;
      #   --allowedTools ""     pre-approves nothing;
      #   --strict-mcp-config   with no MCP config, so no MCP server loads;
      #   --disable-slash-commands  no skills or commands.
      # The tier prompt replaces the system prompt (byte-identical, so it
      # caches); the pull request arrives on stdin between UNTRUSTED markers
      # carrying a random id it cannot predict. `env -i` gives the CLI the
      # OAuth token and nothing else of note: no GitHub token of any kind.
      - name: Review
        if: steps.inputs.outputs.ok == 'true' && steps.configured.outputs.oauth == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TIER: ${{ steps.inputs.outputs.tier }}
        run: |
          set -uo pipefail
          in="$RUNNER_TEMP/review-input"
          rt="$RUNNER_TEMP/review"
          cli="$GITHUB_WORKSPACE/.github/review/cli/node_modules/.bin/claude"
          case "$TIER" in
            security) models="claude-opus-5-5 claude-sonnet-5-5" ;;
            code)     models="claude-opus-5-5 claude-sonnet-5-5" ;;
            data)     models="claude-sonnet-5-5" ;;
            *) echo "::error::unknown tier"; exit 1 ;;
          esac

          # Tokens matter: a data change the deterministic check already
          # failed does not need a model to fail it again.
          if [ "$TIER" = data ] && [ "$(tail -n 1 "$rt/verdicts/data-check.txt" 2>/dev/null)" != "VERDICT: PASS" ]; then
            echo '{"subtype": "skipped: the data check failed"}' > "$rt/verdicts/claude-sonnet-5-5.json"
            exit 0
          fi

          id=$(openssl rand -hex 16)
          {
            echo "<<<UNTRUSTED PR CONTENT BEGIN $id>>>"
            jq -r '"Pull request #\(.number) by \(.author)\nTitle: \(.title)\nHead: \(.head_sha)"' "$in/meta.json"
            echo
            echo "Changed files:"
            cat "$rt/files.txt"
            echo
            echo "Diff:"
            cat "$in/diff.patch"
            echo
            echo "<<<UNTRUSTED PR CONTENT END $id>>>"
          } > "$rt/message.txt"

          work=$(mktemp -d)
          for model in $models; do
            echo "::group::$model"
            ( cd "$work" && env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 \
                CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
                DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
                timeout 900 "$cli" -p --model "$model" \
                  --system-prompt-file "$GITHUB_WORKSPACE/.github/review/$TIER.md" \
                  --tools "" --disallowedTools "*" --allowedTools "" \
                  --strict-mcp-config --disable-slash-commands \
                  --no-session-persistence --output-format json \
                  < "$rt/message.txt" > "$rt/verdicts/$model.json" \
                  2> "$rt/verdicts/$model.err" ) \
              || echo "::warning::$model exited non-zero"
            # NOTHING THE MODEL WROTE reaches this public log before the
            # ledger is settled: a FAIL seen here could be cancelled away.
            echo "$model: $(wc -c < "$rt/verdicts/$model.json") bytes, kept for the comment"
            echo "::endgroup::"
          done

      - name: Read the verdicts
        id: verdict
        if: steps.inputs.outputs.ok == 'true' && steps.configured.outputs.oauth == 'true'
        env:
          TIER: ${{ steps.inputs.outputs.tier }}
        run: |
          set -uo pipefail
          v="$RUNNER_TEMP/review/verdicts"
          case "$TIER" in
            security|code) specs=("claude-opus-5-5=$v/claude-opus-5-5.json" "claude-sonnet-5-5=$v/claude-sonnet-5-5.json") ;;
            data)          specs=("data-check=$v/data-check.txt" "claude-sonnet-5-5=$v/claude-sonnet-5-5.json") ;;
            *)             specs=() ;;
          esac
          # Into files and step outputs only; nothing is echoed until the
          # ledger is settled.
          out=$(python3 tools/review_verdict.py "$RUNNER_TEMP/review/comment.md" "${specs[@]}")
          echo "result=$(printf '%s\n' "$out" | tail -n 1)" >> "$GITHUB_OUTPUT"
          # Only a FAIL some reviewer actually gave is remembered; an outage
          # (no answer at all) fails this run but does not brand the change.
          if printf '%s\n' "$out" | grep -qx 'record: yes'; then
            echo "record=yes" >> "$GITHUB_OUTPUT"
          fi

      # Settle the claim, before anything is posted or printed. A PASS
      # releases it; a FAIL a reviewer gave marks the change failed for
      # good; anything else (no answer) leaves it counted as a failure.
      # A cancelled run never gets here, so its claim stays a failure.
      - name: Settle the ledger
        id: settle
        if: ${{ !cancelled() && steps.inputs.outputs.claimed == 'true' }}
        env:
          LEDGER_TOKEN: ${{ steps.ledger-app.outputs.token }}
          LEDGER_REPO: LPSD-1/trailblazer-review-ledger
          PID: ${{ steps.inputs.outputs.pid }}
          PR: ${{ steps.inputs.outputs.pr }}
          RESULT: ${{ steps.verdict.outputs.result }}
          RECORD: ${{ steps.verdict.outputs.record }}
        run: |
          set -uo pipefail
          outcome=error
          if [ "$RESULT" = "PASS" ]; then
            outcome=pass
          elif [ "$RECORD" = "yes" ]; then
            outcome=failed
          fi
          python3 tools/review_ledger.py settle --pid "$PID" --pr "$PR" \
            --branch "$HEAD_BRANCH" --outcome "$outcome" \
            || { echo "::error::Could not settle patch-id $PID ($outcome)"; exit 1; }
          echo "settled=$outcome" >> "$GITHUB_OUTPUT"

      # Not on cancellation: the check it left "in progress" and the status
      # it left "pending" still block a merge.
      - name: Post the status and the comment
        if: ${{ !cancelled() && steps.app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LEDGER_TOKEN: ${{ steps.ledger-app.outputs.token }}
          LEDGER_REPO: LPSD-1/trailblazer-review-ledger
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CHECK_ID: ${{ steps.pending.outputs.check_id }}
          SETTLED: ${{ steps.settle.outputs.settled }}
          OK: ${{ steps.inputs.outputs.ok }}
          REASON: ${{ steps.inputs.outputs.reason }}
          PR: ${{ steps.inputs.outputs.pr }}
          TIER: ${{ steps.inputs.outputs.tier }}
          PID: ${{ steps.inputs.outputs.pid }}
          OAUTH: ${{ steps.configured.outputs.oauth }}
          RESULT: ${{ steps.verdict.outputs.result }}
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP/review"
          mkdir -p "$rt"
          read_verdicts=no
          if [ "$OK" != "true" ]; then
            state=failure; desc="${REASON:-The review could not start}"
          elif [ "$OAUTH" != "true" ]; then
            state=error; desc="reviewer not configured"
          elif [ "$RESULT" = "PASS" ]; then
            # Success needs a settled claim and a ledger that, read once
            # more, still has nothing against this change.
            if [ "$SETTLED" = "pass" ] \
               && python3 tools/review_ledger.py check --patch-only --pid "$PID" \
                    --pr "$PR" --branch "$HEAD_BRANCH"; then
              state=success; desc="Passed the $TIER review"; read_verdicts=yes
            else
              state=failure; desc="The ledger refuses this change"
            fi
          elif [ "$RESULT" = "FAIL" ]; then
            state=failure; desc="Failed the $TIER review: see the PR comment"; read_verdicts=yes
          else
            state=failure; desc="The review did not finish"
          fi
          desc="${desc:0:140}"
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" \
            -f context=independent-review -f description="$desc" \
            -f target_url="$RUN_URL" > /dev/null
          # The check run the ruleset requires: same verdict, same app.
          conclusion=failure
          [ "$state" = success ] && conclusion=success
          check_args=(-f status=completed -f conclusion="$conclusion"
                      -f details_url="$RUN_URL"
                      -f "output[title]=$desc" -f "output[summary]=$desc")
          if [ -n "$CHECK_ID" ]; then
            gh api -X PATCH "repos/$REPO/check-runs/$CHECK_ID" "${check_args[@]}" > /dev/null
          else
            gh api -X POST "repos/$REPO/check-runs" -f name=independent-review \
              -f head_sha="$HEAD_SHA" "${check_args[@]}" > /dev/null
          fi
          echo "independent-review: $state / $conclusion ($desc)"

          [ -n "$PR" ] || exit 0
          body="$rt/comment.md"
          if [ "$read_verdicts" != yes ] || [ ! -s "$body" ]; then
            printf '<!-- independent-review -->\n## Independent review: %s\n\n%s\n\n[Run](%s)\n' \
              "$state" "$desc" "$RUN_URL" > "$body"
          fi
          jq -n --rawfile body "$body" '{body: $body}' > "$rt/comment.json"
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"${APP_SLUG}[bot]\"
                    and (.body | startswith(\"<!-- independent-review -->\"))) | .id" \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input "$rt/comment.json" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input "$rt/comment.json" > /dev/null
          fi
