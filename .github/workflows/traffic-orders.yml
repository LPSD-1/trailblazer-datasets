name: Traffic orders

# FOUR TIMES A DAY, and it is the only job here that runs on that clock.
#
# Everything else in this repository is a snapshot of something that moves over
# weeks: councils amend a definitive map monthly, Ordnance Survey republish
# place names twice a year, the ground does not move at all. A traffic
# regulation order is the opposite — measured against the live feed, 1,124
# orders changed nationally in a single day — and the one that matters is the
# one made this morning. A rider who finds out about a closure by arriving at
# it is the failure this exists to prevent.
#
# It is affordable because it is small: every live order in Great Britain seals
# to under four megabytes.
on:
  schedule:
    # Spread across the day rather than every six hours on the hour, so this
    # does not arrive at the same moment as everybody else's cron.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the pack is unchanged'
        type: boolean
        default: false

permissions:
  contents: write   # the release asset, and the committed index
  # WITHOUT THIS THE ALARM CANNOT RING, and this is the job that needs it most.
  #
  # Declaring `permissions:` at all REPLACES the default set, so naming only
  # `contents` left the failure step at the bottom calling createIssue with no
  # right to do it. The log says so in as many words — "Resource not accessible
  # by integration (createIssue)" — and the `|| true` that exists to stop a
  # broken alarm failing an already-failed run swallowed it.
  #
  # Every other workflow here already grants it. This one, which runs four times
  # a day, did not: it failed on every run from 14 September and was found by a
  # person looking at the Actions tab, which is the exact thing the alarm exists
  # to make unnecessary.
  issues: write     # to raise one when a run fails

concurrency:
  group: traffic-orders
  cancel-in-progress: false   # never interrupt a run mid-publish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet cryptography

      - name: Write the dataset key
        env:
          DATASET_KEY_B64: ${{ secrets.DATASET_KEY_B64 }}
        run: |
          if [ -z "$DATASET_KEY_B64" ]; then
            echo "::error::DATASET_KEY_B64 is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "It must be the same key the shipped app was built with, or"
            echo "every rider's packages will stop opening."
            exit 1
          fi
          printf '%s' "$DATASET_KEY_B64" > /tmp/dataset.key
          # 32 bytes, base64 encoded, is 44 characters with padding. A key that
          # is present but truncated fails later, in the seal, with a message
          # about cryptography rather than about configuration.
          test "$(wc -c < /tmp/dataset.key)" -ge 43

      - name: Write the D-TRO credentials
        env:
          DTRO_CLIENT_ID: ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
        run: |
          if [ -z "$DTRO_CLIENT_SECRET" ]; then
            echo "::error::DTRO_CLIENT_SECRET is not set. See .env.example."
            exit 1
          fi
          # Production, because that is the only environment these credentials
          # work in — see docs/TRO_SPEC.md 1.2. There is no sandbox, which is
          # why tools/dtro_events.py paces itself and honours Retry-After.
          {
            printf 'DTRO_CLIENT_ID=%s\n' "$DTRO_CLIENT_ID"
            printf 'DTRO_CLIENT_SECRET=%s\n' "$DTRO_CLIENT_SECRET"
            printf 'DTRO_BASE_URL=https://dtro.dft.gov.uk/v1\n'
          } > .env

      # The national extract is half a gigabyte and the service cuts it on its
      # own schedule — measured, it served a nine-day-old file all day on 14
      # September. Caching it means four runs a day fetch it once.
      - name: Today, for the cache key
        id: day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # KEYED ON THE DAY, NOT THE RUN. `github.run_id` is unique to the run, so
      # the exact key could never hit: every one of the four runs a day missed,
      # restored through the prefix, and then wrote a fresh half-gigabyte cache
      # entry. That is two gigabytes a day against a ten gigabyte allowance,
      # and what it evicts is the council-data cache the lane refresh depends
      # on. Keyed on the date, the first run of the day writes one entry and
      # the other three hit it and write nothing.
      - name: Restore the corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: dist/tro/_corpus
          key: dtro-corpus-${{ steps.day.outputs.date }}
          restore-keys: dtro-corpus-

      # THE FEED'S DELTA: every order /events has reported since the extract
      # was cut, as it stands now (tools/tro_events.py). It is what moves the
      # pack between extract cuts - from 6 September 2026 DfT stopped re-cutting
      # /dtros/all for four weeks, and a build reading the extract alone
      # republished the same picture four times a day.
      #
      # KEYED PER RUN, unlike the corpus above. actions/cache never re-saves a
      # key it restored exactly, so a per-day key would keep only the first
      # run's progress each day; restore-keys picks up the newest delta. It is
      # small - a few megabytes - so four a day costs nothing the corpus does.
      # Losing it is not a fault: the build catches up from the extract's cut
      # again, within its time budget, and dates the pack by how far it got.
      - name: Restore the order delta
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: dist/tro/_events
          key: dtro-events-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dtro-events-

      - name: Run the tests before trusting the build
        run: |
          python tools/test_osgb.py
          python tools/test_tro.py
          python tools/test_tro_merge.py
          python tools/test_tro_events_move_the_pack.py
          python tools/test_build_tro.py
          python tools/test_dtro_fetch.py
          # THE COUNCIL TABLE. build_tro.py reads tools/tro_authorities.csv and
          # refuses to publish without it, and the lane sheet names the
          # council from the `authorities` block it writes. These three are
          # the tests of that table, its reader and its wiring; this job is
          # the only one that builds the order pack, so it is the only place
          # they protect anything.
          python tools/test_tro_authorities.py
          python tools/test_tro_council_table.py
          python tools/test_tro_council_wiring.py
          # THE CODES THEMSELVES, against GeoPlace's own SWA list
          # (fetched below from GeoPlace's link). A wrong code is
          # not a crash: it names one council beside another council's
          # orders. Named here because refresh-data's tools/test_*.py loop
          # stops before it reaches this file.
          # Fetched here, never committed (GeoPlace's list; this repository is
          # public). A failed fetch is a warning: it must never stop the
          # order pack, which riders need more than this cross-check.
          if curl -fsSL --max-time 60 -o tools/geoplace_swa_org_active_2026-09-30.csv               https://static.geoplace.co.uk/downloads/SWA_ORG_ACTIVE_2026-09-30.csv; then
            python tools/test_tro_council_codes_match_geoplace.py
          else
            echo "::warning::GeoPlace's SWA list could not be fetched; council codes not cross-checked this run"
          fi

      # ONE ORDER OF EACH TYPE, THROUGH THE REAL BUILD.
      #
      # A different question from the tests above. They ask whether the code
      # does what it did yesterday; this asks whether an order of each kind in
      # PIVOT-SPEC.md 5.3 still resolves to the right vehicles - and weight and
      # width orders are the only OFFICIAL evidence we hold that a lane is shut
      # to a 4x4 and open to a motorbike.
      #
      # It needs no key, no credentials and no corpus: it writes its own CSV in
      # the shape D-TRO publishes and feeds it to read_corpus, the same
      # function the national build calls. So it can run before anything is
      # fetched, and a wrong table stops the run rather than shipping.
      #
      # Shown red by `--mutate`, which misfiles a width limit as a road
      # closure: "no 4x4s" becomes "nobody at all", and a lane a motorbike may
      # legally ride disappears from its map.
      - name: An order of each type resolves to the right vehicles
        run: python tools/build_tro.py --check-order-types

      # THE PUBLISHED INDEX, TAKEN BEFORE THE BUILD OVERWRITES IT.
      #
      # build_tro.py writes tro/index.json in place, so after the build the
      # working tree holds only the new one. The closure gate below compares
      # the two, and the old one has to come out of git first.
      - name: Keep the published index to compare against
        run: git show HEAD:tro/index.json > /tmp/tro-previous.json

      - name: Build the pack
        run: python tools/build_tro.py --key /tmp/dataset.key

      # THE ASSET IS NAMED AFTER ITS OWN HASH, SO A NAME NEVER CHANGES MEANING.
      #
      # It used to go up under one stable name, gb-tro.tbpack, with --clobber.
      # Then anything that stopped the run between the upload and the push -
      # most often all three push attempts losing to the other workflows that
      # commit catalogue.json - left the NEW bytes served at the URL the
      # committed index gives with the OLD hash. The run went red and the alarm
      # rang, but every phone that fetched orders until the next good run
      # failed its checksum; the issue's "riders keep the last published pack"
      # was not true.
      #
      # Content-addressed, the new bytes go up under a new name and the
      # committed index keeps pointing at bytes that still match it, whatever
      # happens afterwards. The phone stores the pack under its id, never the
      # URL's name, so nothing on the phone changes. The name is a function of
      # the hash, so an unchanged pack keeps an unchanged index and "Has
      # anything changed?" still publishes nothing. build_tro.py writes the
      # stable build name; this step renames the copy that is uploaded and
      # rewrites `file` to match. tools/test_tro_push_race_keeps_its_index.py
      # runs this step with every push rejected.
      - name: Name the pack after its contents
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, sys
          path = "tro/index.json"
          with open(path, encoding="utf-8") as fh:
              index = json.load(fh)
          pack = index["packs"][0]
          built = os.path.join("dist", "tro", "gb-tro.tbpack")
          with open(built, "rb") as fh:
              got = hashlib.sha256(fh.read()).hexdigest()
          if got != pack["sha256"]:
              sys.exit("%s is %s but tro/index.json says %s"
                       % (built, got, pack["sha256"]))
          name = "gb-tro-%s.tbpack" % got[:16]
          shutil.copyfile(built, os.path.join("dist", "tro", name))
          pack["file"] = pack["file"].rsplit("/", 1)[0] + "/" + name
          with open(path, "w", encoding="utf-8", newline="\n") as fh:
              json.dump(index, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print("the pack goes up as", name)
          PY

      # THE GATE THAT READS WHAT WAS BUILT. check_closures refuses a live
      # closure count that collapsed or tripled since the published index, and
      # check_council_coverage refuses a pack that cannot say which councils
      # publish - one with no `councils` count reads "coverage unknown" on
      # every phone. Neither ran anywhere before: refresh-data.yml builds no
      # traffic-order index, so both printed "THIS GATE DID NOT RUN".
      #
      # --orders-only, because this job builds no lanes. Without it the lane
      # gates ran here too: check_authorities refused any run without a full
      # rowmaps cache in cache/ (gitignored, written only by refresh-data.yml),
      # and check_totals / check_declared_bounds judged the committed lane
      # manifest. An evicted cache or a lane fault then stopped closures
      # publishing although nothing about the orders was wrong. The lane gates
      # run where lanes are built, in refresh-data.yml - and so does the
      # council table's comparison with the lane authorities, which only warns.
      # tools/test_the_order_gate_needs_no_lane_cache.py runs this step.
      # It runs before anything is published.
      - name: Check the built pack before publishing it
        run: |
          python tools/check_build.py --orders-only \
            --closures-previous /tmp/tro-previous.json \
            --closures-new tro/index.json

      # THE EXTRACT HAS STOPPED MOVING, AND NOTHING ELSE WOULD SAY SO.
      #
      # dtro_fetch.py takes whatever /dtros/all serves and build_tro.py stamps
      # the pack with that extract's own date. When the service stops
      # re-cutting it - it served the 6 September 2026 cut until at least 2
      # October - every run rebuilds the identical pack, "Has anything
      # changed?" publishes nothing, and the run is green. The failure alarm
      # below only rings on a FAILED run, so for weeks the owner was told
      # nothing while riders' phones said how old their orders were.
      #
      # This WARNS and never fails the job (continue-on-error, and every gh
      # call may fail): a stale extract is still the newest there is. One
      # issue at a time under its OWN label - not `traffic-orders`, which
      # "Stand the alarm down" closes on every green run - kept current with
      # the cut's age, and closed by the first run that sees a fresh cut.
      # Not gated on publishing: a stalled extract is exactly the run that
      # publishes nothing. tools/test_tro_cut_age_alarm.py runs this step.
      - name: Say so when the extract has stopped moving
        id: cutage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A crash here must not read as "fresh" and close the issue, so
          # anything but an explicit stale=false is treated as stale.
          REPORT=$(python tools/check_build.py --orders-cut-age tro/index.json || true)
          echo "$REPORT"
          CUT=$(printf '%s\n' "$REPORT" | sed -n 's/^cut=//p')
          AGE=$(printf '%s\n' "$REPORT" | sed -n 's/^age=//p')
          LIMIT=$(printf '%s\n' "$REPORT" | sed -n 's/^limit=//p')
          STALE=$(printf '%s\n' "$REPORT" | sed -n 's/^stale=//p')
          OPEN=$(gh issue list --label traffic-orders-stale --state open \
                   --json number --jq '.[].number' 2>/dev/null || true)
          if [ "$STALE" != "false" ]; then
            echo "::warning::The traffic orders are as of ${CUT:-unknown}, ${AGE:-unknown} days old (over ${LIMIT:-7}): neither the extract nor the events feed moved them. Publishing anyway."
            TITLE="Traffic orders: the published orders are ${AGE:-unknown} days old"
            BODY="The traffic orders this job publishes are dated ${CUT:-unknown}, ${AGE:-unknown} days before this run ($RUN_URL). The build lays the live /events feed over the national extract and dates the pack by how far the feed reached, so over ${LIMIT:-7} days means the feed is not moving the pack either - not just that DfT has stopped re-cutting the extract.

          Every run can still be green: an unchanged picture makes an identical pack and nothing is published. Riders are shown this age on their phones, and orders made since then are not on their maps.

          - Read the 'Build the pack' step: its events lines say how far the feed got and whether a run stopped at its time budget.
          - Check what /dtros/all and /events are serving, and ask d-tro@dft.gov.uk whether either is paused.

          This issue is updated by every run while the extract stays old, and closed by the first run that sees a fresh one."
            FIRST=$(printf '%s\n' "$OPEN" | head -n 1)
            if [ -n "$FIRST" ]; then
              gh issue edit "$FIRST" --title "$TITLE" --body "$BODY" || true
            else
              gh label create traffic-orders-stale --color FBCA04 \
                --description "The D-TRO extract has stopped moving" 2>/dev/null || true
              gh issue create --label traffic-orders-stale \
                --title "$TITLE" --body "$BODY" || true
            fi
          else
            for n in $OPEN; do
              gh issue close "$n" --comment "The extract moved: cut $CUT, $AGE days old. $RUN_URL" || true
            done
          fi

      # AND IF THE ALARM ITSELF BROKE, SAY THAT.
      #
      # continue-on-error keeps a broken alarm from stopping a fresh pack
      # publishing, but on its own it would also hide it: the step goes
      # orange, the run stays green, and the stale extract it exists to
      # report is never reported. Same label, so the first run whose alarm
      # works and sees a fresh cut closes this too.
      # tools/hunt_data_pipeline_alarms.py holds every continue-on-error
      # step to this.
      - name: Say so if the stale-extract alarm could not run
        if: steps.cutage.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning::The stale-extract alarm failed; nobody can tell how old the published orders are."
          OPEN=$(gh issue list --label traffic-orders-stale --state open \
                   --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "The stale-extract check itself failed: $RUN_URL" || true
          else
            gh label create traffic-orders-stale --color FBCA04 \
              --description "The D-TRO extract has stopped moving" 2>/dev/null || true
            gh issue create --label traffic-orders-stale \
              --title "Traffic orders: the stale-extract check could not run" \
              --body "$RUN_URL could not measure how old the D-TRO extract is, so a stalled extract would go unreported. See the step 'Say so when the extract has stopped moving' in that run." || true
          fi

      - name: Forget the credentials
        if: always()
        run: rm -f .env /tmp/dataset.key

      # Nothing changed: the build is reproducible, so an unchanged corpus
      # produces a byte-identical pack and the same hash. Publishing it anyway
      # would make every rider re-download four megabytes to be told nothing
      # had happened.
      - name: Has anything changed?
        id: changed
        run: |
          if git diff --quiet -- tro/index.json && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The pack is identical to the one already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # THE CATALOGUE IS BUILT AND VERIFIED BEFORE THE PACK IS UPLOADED.
      #
      # It used to come after. The upload then replaced the release asset in
      # place (stable name, --clobber; see "Name the pack after its contents"
      # for why it no longer does), so a verify_catalogue refusal here left
      # NEW bytes served under the OLD committed hash: every rider's order
      # download failed its checksum until a later run republished, while
      # the failure issue told the owner riders "keep the last published
      # pack". Built first, a refusal stops the run with the old asset and
      # the old index still agreeing. Nothing in this step needs the upload.
      - name: Rebuild the catalogue
        if: steps.changed.outputs.publish == 'true'
        run: |
          # THE shared script, never a hand-written flag list. Three separate
          # workflows once each rebuilt this with their own subset of flags and
          # each quietly deleted what the others had published; see the comment
          # at the top of that file.
          # THE COMMITTED manifest.json, not dist/manifest.json.
          #
          # This job builds only dist/tro/, and dist/ is gitignored, so
          # dist/manifest.json does not exist here. build_catalogue.lane_areas
          # returns {} for a missing file without a word - and because
          # satellite, names, height and trips packs are all attached INTO lane
          # areas, losing the lanes takes every GB pack of every kind with it.
          # Measured: 8.5 GB against the 9.8 GB every other job produces.
          #
          # verify_catalogue then refuses, correctly, and the job dies AFTER
          # the release asset has been replaced and BEFORE the index is
          # committed - so the published bytes and the published hash disagree
          # and every rider's download fails its integrity check, four times a
          # day. Every other workflow passes the committed manifest;
          # refresh-data is the only one entitled to dist/, because it is the
          # job that builds it.
          bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
          python tools/verify_catalogue.py dist/catalogue.json

      - name: Publish the pack
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single moving tag, like the routing mirror, holding one asset
          # per pack, each named after its hash ("Name the pack after its
          # contents"). The committed index says which one riders get.
          gh release view tro >/dev/null 2>&1 || \
            gh release create tro --notes "Traffic regulation orders, rebuilt through the day."
          NAME=$(python -c "import json;print(json.load(open('tro/index.json'))['packs'][0]['file'].rsplit('/',1)[1])")
          # NEVER --clobber. A name already in the release is these exact
          # bytes, and may be the one the committed index names: replacing it
          # deletes it first, and phones fetching in that gap get a 404. A
          # forced republish, a re-run after a lost push, or orders that went
          # back to an earlier cut all find it there.
          HAVE=$(gh release view tro --json assets \
                   --jq '.assets[] | select(.state == "uploaded") | .name')
          if printf '%s\n' "$HAVE" | grep -qxF "$NAME"; then
            echo "$NAME is already published"
          else
            # AN UPLOAD THAT DIED PART-WAY leaves the name behind in a state
            # other than "uploaded". Nothing can download it, but gh refuses
            # to upload over any name it finds without --clobber, so every
            # run that built these bytes would fail here until the orders
            # changed - for weeks, when the extract stalls. Remove it first;
            # no phone can be fetching it.
            BROKEN=$(gh release view tro --json assets \
                       --jq '.assets[] | select(.state != "uploaded") | .name')
            if printf '%s\n' "$BROKEN" | grep -qxF "$NAME"; then
              echo "removing a half-uploaded $NAME"
              gh release delete-asset tro "$NAME" --yes
            fi
            gh release upload tro "dist/tro/$NAME"
          fi

      # Prove the pack riders will actually download is the one we just built,
      # rather than trusting that the upload went where it was told.
      - name: Check the published pack matches the index
        if: steps.changed.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, sys, urllib.request
          index = json.load(open("tro/index.json"))["packs"][0]
          url = index["file"]
          print("fetching", url)
          data = urllib.request.urlopen(url, timeout=300).read()
          got = hashlib.sha256(data).hexdigest()
          if got != index["sha256"]:
              sys.exit("published pack does not match the index:\n"
                       "  index says %s\n  release is %s" % (index["sha256"], got))
          if len(data) != index["bytes"]:
              sys.exit("published pack is %d bytes, index says %d"
                       % (len(data), index["bytes"]))
          print("matches: %d bytes, %s" % (len(data), got[:16]))
          PY

      - name: Commit the index and the catalogue
        if: steps.changed.outputs.publish == 'true'
        run: |
          git config user.name  "trailblazer-data"
          git config user.email "data@trailblazer.invalid"
          CUT=$(python -c "import json;print(json.load(open('tro/index.json'))['generated'])")

          commit_it() {
            cp dist/catalogue.json catalogue.json
            git add -A tro/index.json catalogue.json
            if git diff --cached --quiet; then
              echo "nothing changed"
              return 1
            fi
            git commit -m "Traffic orders: data cut ${CUT}" -m "Rebuilt by .github/workflows/traffic-orders.yml"
            return 0
          }

          commit_it || exit 0

          # NO REBASE. catalogue.json is GENERATED and rebuilt whole by both
          # sides, so it does not merge - it conflicts, every time, by
          # construction. refresh-data.yml and satellite.yml both record what
          # happened when a job ran `git pull --rebase` here: the rebase
          # stopped mid-way, the retry loop pulled again into an unresolved
          # conflict, and it pushed from a detached HEAD.
          #
          # This job collides more than any other - four runs a day against
          # height, satellite, mirror-routing and refresh-data, all in
          # different concurrency groups and all committing this same file - so
          # it is the last one that should have kept the anti-pattern.
          #
          # A generated file has no merge: it has a recipe. Take the newest
          # main, run the recipe again on top of it, try once more. dist/ is
          # gitignored, so the pack we built survives the reset and nothing is
          # re-fetched.
          #
          # BUT tro/index.json IS NOT IN dist/. It is the one tracked file this
          # job builds, and `git reset --hard` put it back to the OLD hash -
          # after the release asset had already been replaced with the NEW
          # bytes. The catalogue was then rebuilt from the old index, nothing
          # differed from main, `commit_it || exit 0` exited green, and every
          # rider's order download failed its checksum until a later run
          # republished. So the built index is kept in dist/ across the reset
          # and put back before the catalogue is rebuilt from it.
          # tools/test_tro_push_race_keeps_its_index.py runs this step.
          cp tro/index.json dist/tro-index.built.json
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected; rebuilding the record on top of origin/main"
            git fetch origin main
            git reset --hard origin/main
            cp dist/tro-index.built.json tro/index.json
            bash tools/rebuild_catalogue.sh manifest.json dist/catalogue.json
            python tools/verify_catalogue.py dist/catalogue.json
            commit_it || exit 0
            sleep $((attempt * 5))
          done
          echo "::error::could not push after three attempts"
          exit 1

      # ONE ASSET PER PACK WOULD OTHERWISE GROW WITHOUT END.
      #
      # Kept: the pack just committed, the one it replaced (a phone that read
      # the catalogue a minute ago is fetching that now), and anything uploaded
      # in the last three days - a phone can hold an older catalogue than the
      # newest and still deserves the bytes it names. Around a dozen packs of
      # four megabytes. Never touched: gb-tro.tbpack, the asset from before
      # packs were named after their hash; an old catalogue that names it
      # names its bytes, and they still match. Runs only after the index is
      # pushed, so an unpushed run never deletes what main still names. A
      # failed tidy-up warns and never fails the run: the orders are already
      # out, and the next run tries again.
      - name: Clear away packs nothing names any more
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Written by "Keep the published index to compare against".
          PREVIOUS_INDEX: /tmp/tro-previous.json
        run: |
          if ! gh release view tro --json assets > dist/tro-assets.json; then
            echo "::warning::could not list the order release; old packs not cleared"
            exit 0
          fi
          OLD=$(python - <<'PY'
          import datetime, json, os, re, sys
          def named(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return json.load(fh)["packs"][0]["file"].rsplit("/", 1)[1]
              except (OSError, ValueError, LookupError, AttributeError):
                  return None
          now = named("tro/index.json")
          if not now:
              sys.exit("cannot tell which pack main names; deleting nothing")
          keep = {now, named(os.environ.get("PREVIOUS_INDEX", ""))}
          print("keeping", " ".join(sorted(k for k in keep if k)),
                file=sys.stderr)
          cutoff = (datetime.datetime.now(datetime.timezone.utc)
                    - datetime.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("dist/tro-assets.json", encoding="utf-8") as fh:
              assets = json.load(fh)["assets"] or []
          for a in assets:
              name = a.get("name") or ""
              made = a.get("createdAt") or ""
              if (re.fullmatch(r"gb-tro-[0-9a-f]+\.tbpack", name)
                      and name not in keep and made and made < cutoff):
                  print(name)
          PY
          ) || { echo "::warning::could not work out which packs to clear"; exit 0; }
          for name in $OLD; do
            echo "deleting $name"
            gh release delete-asset tro "$name" --yes \
              || echo "::warning::could not delete $name from the order release"
          done

      - name: Raise an issue if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Silence is the failure mode that matters here. The app shows no
          # closures whether the job is working perfectly in an area nobody
          # publishes in, or has been broken for a fortnight — so a broken run
          # has to say so somewhere a person will see it.
          #
          # ONE OPEN ISSUE AT A TIME, which every other job here already does.
          # This one runs four times a day, so the moment the permission above
          # let the alarm ring it would have opened four issues a day about a
          # single fault — which is its own kind of silence.
          EXISTING=$(gh issue list --label traffic-orders --state open \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh label create traffic-orders --color D93F0B \
              --description "Automated traffic-order build problems" 2>/dev/null || true
            gh issue create --label traffic-orders \
              --title "Traffic orders build failed" \
              --body "$RUN_URL failed. Riders keep the last published pack until this is fixed, so orders will quietly go stale.

          The usual causes, commonest first:

          - **DATASET_KEY_B64 is not set.** Every pack in this repository is sealed
            with it, and without it the build stops before it starts.
          - **DTRO_CLIENT_SECRET has expired.** Rotate it with d-tro@dft.gov.uk.
          - **The service is down, or serving a stale extract.** The build refuses
            to publish a pack that falls under the floor rather than quietly
            shipping a country with no closures in it."
          fi

      # AND STAND IT DOWN AGAIN.
      #
      # Nothing closed these. Two of the three issues open on 16 September were
      # for faults that had already fixed themselves - satellite had succeeded
      # several times since its issue was raised - and an alarm that never
      # resets is one people learn to scroll past, which is the failure the
      # alarm exists to prevent.
      - name: Stand the alarm down if this worked
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label traffic-orders --state open \
                       --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "Fixed: $RUN_URL succeeded." || true
          done
